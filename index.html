  <style>
    /* ============ TOKENS ============ */
    :root {
      --bg: #EEE2F0;
      --card: #FAF6FA;
      --text: #2B1B3D;
      --muted: #5B4B6B;
      --border: #CDBFD6;
      --primary: #4338CA;
      --primary-soft: #EEEBFF;
      --fund: #047857;
      --fund-soft: #D1FAE5;
      --don: #BE185D;
      --don-soft: #FCE7F1;
      --due: #9A3412;
      --due-soft: #FEF0E7;
      --paid-bg: #D1FAE5;
      --paid-fg: #064E3B;
      --white: #FFFFFF;
      --r-card: 20px;
      --r-input: 14px;
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, .06);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #E3D6E7;
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior-y: none;
    }

    input,
    textarea,
    select,
    button {
      font-family: inherit;
    }

    input,
    textarea {
      user-select: text;
    }

    /* ============ APP FRAME (390px) ============ */
    #app {
      width: 100%;
      max-width: 390px;
      margin: 0 auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    @media (min-width: 420px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 0;
      }

      #app {
        height: calc(100dvh - 40px);
        max-height: 880px;
        border-radius: 34px;
        box-shadow: 0 0 0 1px rgba(43, 27, 61, .07), 0 40px 90px -30px rgba(43, 27, 61, .45);
      }
    }

    /* ============ SCREEN ============ */
    #view {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    #view::-webkit-scrollbar {
      display: none;
    }

    .screen {
      padding: 18px 16px calc(28px + var(--safe-b));
      animation: screenIn .26s cubic-bezier(.2, .8, .3, 1) both;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ============ TYPO ============ */
    .h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin: 2px 0 0;
    }

    .h2 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.01em;
      margin: 0;
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
      margin: 4px 0 0;
      line-height: 1.45;
    }

    .eyebrow {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }

    .num {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    /* ============ CARD ============ */
    .card {
      background: var(--card);
      border: 1px solid var(--white);
      border-radius: var(--r-card);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .card+.card {
      margin-top: 12px;
    }

    .stack>*+* {
      margin-top: 12px;
    }

    /* ============ BUTTONS ============ */
    .btn {
      min-height: 50px;
      width: 100%;
      border-radius: var(--r-input);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      padding: 0 16px;
      cursor: pointer;
      transition: transform .12s ease, filter .18s ease, background .18s ease;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      min-height: 52px;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-outline {
      background: var(--white);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      min-height: 44px;
    }

    .btn-sm {
      min-height: 44px;
      width: auto;
      padding: 0 16px;
      font-size: 13.5px;
      border-radius: 12px;
      flex: none;
    }

    .linklike {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      background: transparent;
      border: 0;
      padding: 0 2px;
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
    }

    /* ============ INPUTS ============ */
    .label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 6px;
    }

    .field {
      height: 48px;
      width: 100%;
      border-radius: var(--r-input);
      border: 1px solid var(--border);
      background: var(--white);
      padding: 0 14px;
      font-size: 15px;
      color: var(--text);
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .field::placeholder {
      color: #A393B0;
    }

    .field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(67, 56, 202, .12);
    }

    .with-icon {
      position: relative;
    }

    .with-icon svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #A393B0;
      pointer-events: none;
    }

    .with-icon .field {
      padding-left: 42px;
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .g3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    /* ============ CHIPS ============ */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--white);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .18s ease, color .18s ease, background .18s ease;
    }

    .chip:active {
      transform: scale(.97);
    }

    .chip[aria-pressed="true"] {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .chip-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      /* 38px chip + 3px padding top/bottom = 44px touch target */
      padding: 3px 2px;
      margin: 10px -2px 2px;
    }

    .chip-row::-webkit-scrollbar {
      display: none;
    }

    .role-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .role-admin {
      background: var(--primary);
      color: #fff;
    }

    .role-viewer {
      background: var(--white);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .pill-paid {
      background: var(--paid-bg);
      color: var(--paid-fg);
    }

    .pill-due {
      background: var(--white);
      color: var(--due);
      border: 1px solid #E8B79C;
    }

    .pill-future {
      background: #F0E9F2;
      color: #A393B0;
    }

    .pill-don {
      background: var(--don-soft);
      color: var(--don);
    }

    /* ============ ROWS ============ */
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 8px 0;
      border-bottom: 1px solid #EFE6F1;
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row-tap {
      cursor: pointer;
    }

    .row-tap:hover {
      background: rgba(67, 56, 202, .03);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 14px;
      font-weight: 800;
      background-size: cover;
      background-position: center;
      border: 1px solid #fff;
    }

    .avatar-lg {
      width: 68px;
      height: 68px;
      font-size: 22px;
    }

    .avatar-sm {
      width: 36px;
      height: 36px;
      font-size: 12px;
    }

    .row-main {
      flex: 1;
      min-width: 0;
    }

    .row-title {
      font-size: 14.5px;
      font-weight: 700;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .amount {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* ============ STATS ============ */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--white);
      border-radius: var(--r-card);
      box-shadow: var(--shadow);
      padding: 14px;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .stat:active {
      transform: scale(.98);
    }

    .stat-num {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -.02em;
      margin: 6px 0 0;
    }

    .icon-box {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      margin-bottom: 8px;
    }

    .fund-big {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -.035em;
      line-height: 1;
      color: var(--fund);
      margin: 8px 0 0;
    }

    /* ============ TOTAL FUND — premium summary card ============ */
    .fund-summary {
      container: fund-summary / inline-size;
      position: relative;
      width: 100%;
      padding: 15px 16px 0;
      border: 1px solid rgba(255, 255, 255, .95);
      border-radius: 23px;
      background:
        radial-gradient(90% 70% at 100% 0%, rgba(16, 185, 129, .07), transparent 55%),
        radial-gradient(70% 60% at 0% 100%, rgba(79, 70, 229, .05), transparent 55%),
        linear-gradient(180deg, #FFFFFF 0%, #FBFAFD 100%);
      box-shadow:
        0 20px 44px -18px rgba(43, 27, 61, .16),
        0 2px 6px rgba(43, 27, 61, .04),
        inset 0 1.5px 0 #fff;
      color: #2B1B3D;
      overflow: hidden;
      isolation: isolate;
    }

    /* emerald accent beam across the top edge */
    .fund-summary::before {
      content: "";
      position: absolute;
      top: 0;
      left: 22%;
      right: 22%;
      height: 3px;
      border-radius: 0 0 6px 6px;
      background: linear-gradient(90deg, transparent, #10B981 30%, #047857 70%, transparent);
      opacity: .75;
    }

    /* giant watermark taka sign, barely visible */
    .fund-summary::after {
      content: "\09F3";
      position: absolute;
      right: -6px;
      bottom: -34px;
      font-size: 150px;
      font-weight: 800;
      line-height: 1;
      color: rgba(4, 120, 87, .05);
      pointer-events: none;
      z-index: 0;
    }

    .fund-summary > * { position: relative; z-index: 1; }

    /* --- header row: icon + labels + live pill --- */
    .fund-summary__head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .fund-summary__icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: none;
      border-radius: 14px;
      background: linear-gradient(145deg, #059669, #047857 60%, #065F46);
      box-shadow:
        0 10px 20px -8px rgba(4, 120, 87, .55),
        inset 0 1px 0 rgba(255, 255, 255, .35),
        inset 0 -2px 4px rgba(0, 0, 0, .15);
      color: #fff;
    }

    .fund-summary__titles { flex: 1; min-width: 0; }

    .fund-summary__title {
      margin: 0;
      font-size: 12.5px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: #2B1B3D;
    }

    .fund-summary__subtitle {
      margin: 3px 0 0;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.45;
      color: #5B4B6B;
    }

    .fund-summary__live {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: #ECFDF5;
      border: 1px solid rgba(4, 120, 87, .14);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .06em;
      color: #047857;
    }

    .fund-summary__live i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10B981;
      animation: fundPulse 2.2s ease-in-out infinite;
    }

    @keyframes fundPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, .45); }
      55% { box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
    }

    /* --- hero amount --- */
    .fund-summary__amount {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin: 10px 0 0;
      font-weight: 800;
      font-size: clamp(32px, 10.5cqi, 42px);
      line-height: 1.05;
      letter-spacing: -.045em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      user-select: text;
      background: linear-gradient(135deg, #065F46 0%, #047857 55%, #10B981 110%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .fund-summary__currency { font-size: .68em; font-weight: 800; }

    /* --- footer: collected / donated breakdown strip --- */
    .fund-summary__foot {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin: 11px -16px 0;
      padding: 9px 16px 10px;
      background: linear-gradient(180deg, rgba(243, 240, 248, .65), rgba(243, 240, 248, .9));
      border-top: 1px solid rgba(205, 191, 214, .35);
    }

    .fund-summary__stat { min-width: 0; }
    .fund-summary__stat + .fund-summary__stat { text-align: right; }

    .fund-summary__stat-label {
      margin: 0;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #8B7A99;
    }

    .fund-summary__stat-value {
      margin: 2px 0 0;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.015em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      user-select: text;
    }

    .fund-summary__stat-value.in { color: #047857; }
    .fund-summary__stat-value.out { color: #BE185D; }

    .fund-summary__foot-div {
      width: 1px;
      height: 24px;
      background: linear-gradient(180deg, transparent, rgba(205, 191, 214, .7), transparent);
    }

    /* wider containers: everything breathes a little more */
    @container fund-summary (min-width: 440px) {
      .fund-summary { padding: 22px 22px 0; }
      .fund-summary__icon { width: 54px; height: 54px; border-radius: 17px; }
      .fund-summary__title { font-size: 14px; }
      .fund-summary__subtitle { font-size: 12.5px; }
      .fund-summary__stat-label { font-size: 10.5px; }
      .fund-summary__stat-value { font-size: 17px; }
      .fund-summary__foot { margin: 20px -22px 0; padding: 14px 22px; }
    }

    @media (max-width: 350px) {
      .fund-summary { padding: 13px 14px 0; border-radius: 21px; }
      .fund-summary__icon { width: 38px; height: 38px; border-radius: 12px; }
      .fund-summary__title { font-size: 11px; letter-spacing: .05em; }
      .fund-summary__subtitle { font-size: 10px; }
      .fund-summary__live { display: none; }
      .fund-summary__amount { font-size: 30px; }
      .fund-summary__foot { margin: 10px -14px 0; padding: 8px 14px 9px; gap: 10px; }
      .fund-summary__stat-value { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fund-summary__live i { animation: none; }
    }

    /* ============ MONTH GRID ============ */
    .month-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .month-cell {
      height: 52px;
      border-radius: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      border: 1px solid var(--border);
      background: var(--white);
    }

    .month-cell .m {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
    }

    .month-cell .s {
      font-size: 12px;
      font-weight: 800;
    }

    .month-cell.paid {
      background: var(--paid-bg);
      border-color: #A7F3D0;
    }

    .month-cell.paid .s {
      color: var(--paid-fg);
    }

    .month-cell.due {
      background: var(--white);
      border-color: #E8B79C;
    }

    .month-cell.due .s {
      color: var(--due);
    }

    .month-cell.future {
      background: #F3ECF5;
      border-color: #E7DCEA;
      color: #A393B0;
    }

    .month-cell.future .s {
      color: #A393B0;
    }

    /* ============ SWITCH ============ */
    .switch-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 48px;
      background: transparent;
      border: 0;
      padding: 0;
      text-align: left;
      cursor: pointer;
    }

    .switch {
      width: 48px;
      height: 28px;
      border-radius: 999px;
      background: #E2D6E6;
      border: 1px solid var(--border);
      position: relative;
      flex: none;
      transition: background .22s ease, border-color .22s ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(43, 27, 61, .25);
      transition: transform .22s cubic-bezier(.3, 1.3, .4, 1);
    }

    .switch[aria-checked="true"] {
      background: var(--primary);
      border-color: var(--primary);
    }

    .switch[aria-checked="true"]::after {
      transform: translateX(20px);
    }

    /* ============ BOTTOM NAV ============ */
    #nav {
      height: calc(84px + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: var(--white);
      border-top: 1px solid #EFE6F1;
      display: none;
      flex: none;
    }

    #nav.show {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .nav-btn {
      min-height: 44px;
      background: transparent;
      border: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #8B7A99;
      cursor: pointer;
      padding: 8px 2px 0;
      min-width: 0;
    }

    .nav-lbl {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 1px;
    }

    /* the 5th tab has a longer label — shrink it slightly so it never clips */
    .nav-lbl-long { font-size: 9.5px; letter-spacing: -.01em; }

    .nav-btn.active {
      color: var(--primary);
      font-weight: 800;
    }

    .nav-dot {
      position: absolute;
      top: 6px;
      right: calc(50% - 18px);
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--due);
      color: #fff;
      font-size: 9.5px;
      font-weight: 800;
      display: grid;
      place-items: center;
    }

    /* ============ HEADER ============ */
    .app-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .profile-app-header { align-items: center; }

    .profile-brand-mark {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      margin: 0;
      padding: 5px;
      flex: none;
      overflow: hidden;
      border-radius: 19px;
      border: 1px solid #fff;
      background: #fff;
      box-shadow: 0 12px 28px -12px rgba(67, 56, 202, .3);
    }

    .profile-brand-mark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 14px;
    }

    /* ============ LOGIN ============ */
    /* Full-screen soft gradient canvas (lavender -> pink -> mint) */
    .login-wrap {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 34px 22px 34px;
      overflow: hidden;
      isolation: isolate;
      /* top #f3e8ff (purple-100) -> bottom #d8b4fe (purple-300) */
      background: linear-gradient(180deg, #f3e8ff 0%, #efe0fe 45%, #dcc4fd 80%, #d8b4fe 100%);
      background-attachment: local;
      /* colours used across the whole login screen */
      --lg-heading: #1e1b4b;   /* deep indigo (main title) */
      --lg-sub: #4b5563;       /* gray-600 (subtitle / labels) */
      --lg-indigo: #4f46e5;    /* indigo-600 */
      --lg-indigo-2: #6366f1;  /* indigo-500 */
    }

    /* keep the frame behind the login screen in the same family so no white
       seam shows if the content is shorter than the viewport */
    #view:has(.login-wrap) { background: #d8b4fe; }

    /* brand mark: your logo image inside a white rounded plate */
    .login-wrap .logo,
    .logo.brand {
      width: 96px;
      height: 96px;
      padding: 8px;
      border-radius: 28px;
      background: #ffffff;
      color: transparent;
      box-shadow:
        0 18px 34px -14px rgba(79, 70, 229, .5),
        0 2px 6px rgba(43, 27, 61, .06),
        inset 0 1px 0 #fff;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .login-wrap .logo::after,
    .logo.brand::after { display: none; }

    .logo.brand img,
    .login-wrap .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 20px;
      background: #fff;
    }

    .login-wrap .login-title { color: var(--lg-heading); }

    .login-wrap .sub { color: var(--lg-sub); }

    .login-byline {
      margin: 4px 0 0;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--lg-sub);
    }

    .login-byline strong {
      font-weight: 600;
    }

    /* indigo buttons + labels on this screen */
    .login-wrap .btn-primary {
      background: linear-gradient(135deg, var(--lg-indigo-2), var(--lg-indigo));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .25),
        0 10px 22px -10px rgba(79, 70, 229, .7);
    }

    .login-wrap .label { color: var(--lg-sub); }

    .login-wrap .field:focus {
      border-color: var(--lg-indigo);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, .12);
    }

    .login-wrap .eyebrow {
      color: var(--lg-indigo);
      letter-spacing: .12em;
    }

    .login-wrap .divider::before,
    .login-wrap .divider::after { background: rgba(79, 70, 229, .18); }

    .login-wrap .divider span { color: var(--lg-indigo); }

    .logo::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(150deg, rgba(255, 255, 255, .35), transparent 58%);
    }

    .login-title {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -.025em;
      text-transform: uppercase;
      color: var(--text);
      margin: 20px 0 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 26px 0 14px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .16em;
      color: var(--muted);
    }

    .error-box {
      background: #FDECEE;
      border: 1px solid #F5C2C9;
      color: #9F1239;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px 12px;
      margin-top: 10px;
    }

    /* ============ DONATIONS — hero + yearly timeline ============ */
    .don-hero {
      position: relative;
      padding: 20px 20px 20px;
      border-radius: 26px;
      color: #fff;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(80% 90% at 88% 8%, rgba(255, 255, 255, .22), transparent 55%),
        radial-gradient(70% 80% at 0% 100%, rgba(255, 255, 255, .12), transparent 55%),
        linear-gradient(135deg, #831843 0%, #BE185D 46%, #EC4899 100%);
      box-shadow:
        0 24px 44px -18px rgba(190, 24, 93, .6),
        inset 0 1.5px 0 rgba(255, 255, 255, .4),
        inset 0 -1.5px 0 rgba(0, 0, 0, .12);
    }

    .don-hero-watermark {
      position: absolute;
      right: -14px;
      bottom: -26px;
      width: 140px;
      height: 140px;
      color: rgba(255, 255, 255, .10);
      z-index: -1;
      pointer-events: none;
    }

    .don-hero::before,
    .don-hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
    }

    .don-hero::before {
      width: 170px; height: 170px;
      right: -46px; top: -66px;
      background: rgba(255, 255, 255, .14);
    }

    .don-hero::after {
      width: 110px; height: 110px;
      left: -30px; bottom: -58px;
      background: rgba(255, 255, 255, .09);
    }

    .don-hero-heart {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .2);
      border: 1px solid rgba(255, 255, 255, .35);
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4);
      z-index: 1;
    }

    .don-hero-label {
      position: relative;
      margin: 0;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .92);
    }

    .don-hero-amount {
      position: relative;
      margin: 10px 0 0;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -.035em;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 10px rgba(131, 24, 67, .25);
    }

    .don-hero-chips {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .don-hero-chip {
      height: 32px;
      padding: 0 12px 0 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, .2);
      border: 1px solid rgba(255, 255, 255, .4);
      backdrop-filter: blur(4px);
    }

    .don-year { margin-top: 18px; }

    .don-year-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .don-year-label {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .1em;
      color: #BE185D;
    }

    .don-year-sum {
      font-size: 12px;
      font-weight: 800;
      color: #9D174D;
      background: #FCE7F1;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .don-timeline {
      position: relative;
      padding-left: 22px;
    }

    .don-timeline::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      border-radius: 2px;
      background: linear-gradient(180deg, #F9A8D4, rgba(249, 168, 212, .15));
    }

    .don-item {
      position: relative;
      margin-bottom: 12px;
    }

    .don-dot {
      position: absolute;
      left: -22px;
      top: 28px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #DB2777;
      box-shadow: 0 0 0 4px rgba(219, 39, 119, .12);
    }

    .don-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 18px;
      border: 1px solid #fff;
      background:
        linear-gradient(135deg, #FFFFFF 60%, #FCE7F1 140%);
      box-shadow: 0 12px 26px -16px rgba(190, 24, 93, .3);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .don-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 32px -16px rgba(190, 24, 93, .4);
    }

    .don-ico {
      width: 44px;
      height: 44px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(145deg, #EC4899, #BE185D);
      box-shadow: 0 8px 16px -8px rgba(190, 24, 93, .6), inset 0 1px 0 rgba(255, 255, 255, .4);
    }

    .don-body { flex: 1; min-width: 0; }

    .don-note {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      color: #2B1B3D;
      overflow-wrap: anywhere;
    }

    .don-date {
      margin: 3px 0 0;
      font-size: 11.5px;
      font-weight: 600;
      color: #8A7B9C;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .don-amt-wrap {
      flex: none;
      text-align: right;
      margin-right: 4px;
    }

    .don-amt {
      margin: 0;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -.02em;
      color: #BE185D;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .don-cap {
      margin: 2px 0 0;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #C99DB4;
    }

    /* ============ PAYMENT HISTORY — member detail ledger list ============ */
    .hist-card {
      position: relative;
      padding: 14px 14px 16px;
      border-radius: 22px;
      background: #fff;
      border: 1px solid #fff;
      box-shadow: 0 12px 30px -16px rgba(43, 27, 61, .18);
      overflow: hidden;
    }
    .hist-head { margin-bottom: 10px; }
    .hist-count {
      margin: 5px 0 0;
      font-size: 12px;
      font-weight: 700;
      color: #5B4B6B;
    }
    .hist-list { position: relative; padding-left: 2px; }
    .hist-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 0;
      animation: histIn .4s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes histIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    /* continuous connector spine running behind the icons */
    .hist-item::before {
      content: "";
      position: absolute;
      left: 19px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(205, 191, 214, .4);
      z-index: 0;
    }
    .hist-item:first-child::before { top: 29px; }
    .hist-item:last-child::before { bottom: auto; height: 29px; }
    .hist-ico {
      position: relative;
      z-index: 1;
      width: 40px;
      height: 40px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--tint-soft);
      color: var(--tint);
      box-shadow: 0 0 0 4px var(--surface, #fff);
    }
    .hist-main { flex: 1; min-width: 0; }
    .hist-title {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      color: #2B1B3D;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hist-sub {
      margin: 3px 0 0;
      font-size: 11.5px;
      color: #7A6B8C;
      white-space: normal;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .hist-chip {
      display: inline-block;
      padding: 2px 8px;
      margin-right: 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: var(--tint);
      background: var(--tint-soft);
    }

    .hist-date {
      font-weight: 700;
      color: #5B4B6B;
    }

    .hist-ago {
      margin-left: 6px;
      font-weight: 600;
      color: #A296AE;
    }

    .hist-amt {
      margin: 0;
      flex: none;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.01em;
      color: #047857;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .hist-del {
      flex: none;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #C3B8CC;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .hist-del:hover { background: #FFE4E9; color: #E11D48; }
    .hist-del:active { transform: scale(.92); }

    .don-del {
      flex: none;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #C99DB4;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }
    .don-del:hover { background: #FFE4E9; color: #E11D48; }
    .don-del:active { transform: scale(.9); }

    .pay-cal {
      background: #fff;
      border: 1px solid #E7DCEA;
      border-radius: 16px;
      padding: 10px;
    }

    .pay-cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .pay-cal-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: #2B1B3D;
    }

    .pay-cal-nav {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid #E7DCEA;
      background: #FAF6FA;
      color: #4338CA;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .pay-cal-nav:focus-visible,
    .pay-cal-day:focus-visible {
      outline: 2px solid #4f46e5;
      outline-offset: 2px;
    }

    .pay-cal-week,
    .pay-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .pay-cal-week span {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: #8B7A99;
      padding: 4px 0;
    }

    .pay-cal-day,
    .pay-cal-empty {
      min-height: 40px;
      border-radius: 12px;
    }

    .pay-cal-day {
      border: 0;
      background: transparent;
      color: #2B1B3D;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .pay-cal-day.today {
      box-shadow: inset 0 0 0 1.5px #C4B5FD;
    }

    .pay-cal-day.on {
      background: #4f46e5;
      color: #fff;
    }

    .date-shown {
      margin: 8px 0 0;
      font-size: 13px;
      font-weight: 700;
      color: #047857;
    }

    /* ============ SHEET ============ */
    .overlay {
      position: absolute;
      inset: 0;
      /* must sit above the fixed bottom nav (z-index 1000), otherwise the
         sheet's buttons are hidden behind it */
      z-index: 1200;
      background: rgba(43, 27, 61, .45);
      backdrop-filter: blur(3px);
      display: none;
      align-items: flex-end;
    }

    .overlay.show {
      display: flex;
      animation: fadeIn .2s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .sheet {
      width: 100%;
      background: var(--card);
      border-radius: 24px 24px 0 0;
      padding: 8px 16px calc(20px + var(--safe-b));
      box-shadow: 0 -20px 50px -20px rgba(43, 27, 61, .5);
      max-height: 82%;
      overflow-y: auto;
      animation: sheetIn .28s cubic-bezier(.2, .9, .3, 1) both;
    }

    @keyframes sheetIn {
      from {
        transform: translateY(30px);
        opacity: .6
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .grab {
      width: 40px;
      height: 4px;
      border-radius: 99px;
      background: var(--border);
      margin: 6px auto 10px;
    }

    .opt {
      width: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid #EFE6F1;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      padding: 0 4px;
    }

    .opt:last-child {
      border-bottom: 0;
    }

    .opt[aria-selected="true"] {
      color: var(--primary);
    }

    /* ============ TOAST ============ */
    #toasts {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100px + var(--safe-b));
      z-index: 1300;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      padding: 0 16px;
    }

    .toast {
      max-width: 100%;
      background: var(--text);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 12px;
      padding: 11px 14px;
      box-shadow: 0 14px 30px -12px rgba(43, 27, 61, .7);
      animation: toastIn .3s cubic-bezier(.2, 1.2, .4, 1) both;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.err {
      background: #9F1239;
    }

    .toast.ok {
      background: var(--fund);
    }

    .toast.out {
      animation: toastOut .25s ease forwards;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.96)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(8px)
      }
    }

    /* ============ MISC ============ */
    .skeleton {
      background: linear-gradient(90deg, #EFE6F1, #F7F1F8, #EFE6F1);
      background-size: 200% 100%;
      animation: shimmer 1.2s linear infinite;
      border-radius: 10px;
      height: 14px;
    }

    @keyframes shimmer {
      from {
        background-position: 200% 0
      }

      to {
        background-position: -200% 0
      }
    }

    .banner {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--primary-soft);
      border: 1px solid #DDD7FB;
      border-radius: 16px;
      padding: 11px 13px;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      line-height: 1.45;
    }

    .banner.amber {
      background: var(--due-soft);
      border-color: #F3D6C4;
      color: var(--due);
    }

    .divider-line {
      height: 1px;
      background: #EFE6F1;
      margin: 14px 0;
    }

    .kv {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 40px;
      font-size: 13.5px;
    }

    .kv span:first-child {
      color: var(--muted);
    }

    .kv span:last-child {
      font-weight: 700;
      text-align: right;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;

    /* ---- Payment accounts (single data source for the Payment Options card) ----

    const LIVE = /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(SUPABASE_URL) && !SUPABASE_ANON_KEY.startsWith("YOUR-");

    /* =====================================================================
       CONSTANTS
    ===================================================================== */
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const MON3 = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const PAY_TYPES = ["Monthly Fee", "Advanced Fee", "Late Fine", "Personal Donation", "Other"];

    /* club fee collection began Sep 2024 */
    const FEE_START = { y: 2024, m: 9 };
    /** month index (year*12 + month-1) for easy cross-year comparison */
    const monthIndex = (y, m) => y * 12 + (m - 1);

    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const taka = (n) => "\u09F3" + Number(n || 0).toLocaleString("en-US");
    const fmtNumOnly = (n) => Number(n || 0).toLocaleString("en-US");
    const pad = (n) => String(n).padStart(2, "0");
    const initials = (n) => String(n || "?").trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
    const uid = (p) => p + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
    /* a real UUID works in BOTH text and uuid columns, so inserts never fail
       with "null value in column id" or "invalid input syntax for type uuid" */
    const newId = () => {
      try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { }
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
      });
    };
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    function nowLocal() {
      const d = new Date();
      return new Date(d.getTime() + (APP_TIMEZONE_OFFSET_MIN + d.getTimezoneOffset()) * 60000);
    }
    function dayOfMonth() { return nowLocal().getDate(); }

    /* =====================================================================
       SUPABASE CLIENT
    ===================================================================== */
    let sb = null;
    if (LIVE && window.supabase && window.supabase.createClient) {
      /* Supabase session is kept in sessionStorage too, so closing the app
         logs the admin out automatically (same policy as the viewer). */
      let authStorage;
      try {
        sessionStorage.setItem("__hb_probe", "1"); sessionStorage.removeItem("__hb_probe");
        authStorage = window.sessionStorage;
      } catch (e) { authStorage = undefined; }

      /* drop any Supabase token an older build left in localStorage */
      try {
        Object.keys(localStorage).forEach(k => { if (/^sb-.*-auth-token/.test(k)) localStorage.removeItem(k); });
      } catch (e) { }

      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storage: authStorage
        }
      });
    }

    if (window.emailjs && !EMAILJS_PUBLIC_KEY.startsWith("YOUR_")) {
      window.emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
    }
    const emailJSReady = () => !EMAILJS_PUBLIC_KEY.startsWith("YOUR_") && !EMAILJS_SERVICE_ID.startsWith("YOUR_") && window.emailjs;

    /* =====================================================================
       STATE
    ===================================================================== */
    const LS_DATA = "hb_data_v2";
    const LS_SETTINGS = "hb_settings_v2";

    const state = {
      session: null,
      isAdmin: false,
      booted: false,
      loading: true,
      members: [],
      payments: [],
      donations: [],
      settings: null,
      duesSearch: "",
      duesMonth: 0,      // 0 = all months
      duesType: "Monthly Fee",
      memberQuery: "",
      donQuery: "",
      demo: !LIVE,
      memberFilter: "all",   // all | paid | due
      memberSort: "paid"     // paid (top payer first) | name | due
    };

    const DEFAULT_SETTINGS = {
      id: 1,
      auto_email_reminder: true,
      send_day: 5,
      channel: "Email",
      /* wallet numbers are empty by design — the admin adds them from
         Payment Options -> "Wallet numbers" whenever they want */
      bkash_number: "",
      nagad_number: "",
      last_sent_at: null,
      last_sent_count: 0
    };

    /* =====================================================================
       DATA ACCESS (Supabase when live, local snapshot in demo)
    ===================================================================== */
    const db = {
      async fetchAll() {
        if (!sb) { this.loadLocal(); return; }
        const [m, p, d, s] = await Promise.all([
          sb.from("members").select("*").order("name", { ascending: true }),
          sb.from("payments").select("*"),
          sb.from("donations").select("*").order("date", { ascending: false }),
          sb.from("app_settings").select("*").eq("id", 1).maybeSingle()
        ]);
        if (m.error) throw m.error;
        if (p.error) throw p.error;
        if (d.error) throw d.error;
        state.members = m.data || [];
        state.payments = p.data || [];
        state.donations = d.data || [];
        state.settings = { ...DEFAULT_SETTINGS, ...(s.data || {}) };
        this.saveLocal();
        notifyReportDataChanged();
      },

      saveLocal() {
        try {
          localStorage.setItem(LS_DATA, JSON.stringify({
            members: state.members, payments: state.payments,
            donations: state.donations, settings: state.settings
          }));
        } catch (e) { }
      },

      loadLocal() {
        let d = null;
        try { d = JSON.parse(localStorage.getItem(LS_DATA) || "null"); } catch (e) { }
        if (d && d.members && d.members.length) {
          state.members = d.members;
          state.payments = d.payments || [];
          state.donations = d.donations || [];
          state.settings = { ...DEFAULT_SETTINGS, ...(d.settings || {}) };
          /* one-time cleanup: drop the old demo wallet numbers from caches */
          if (state.settings.bkash_number === "01712345678") state.settings.bkash_number = "";
          if (state.settings.nagad_number === "01812345678") state.settings.nagad_number = "";
        } else {
          this.seed();
          this.saveLocal();
        }
      },

      seed() {
        const defs = [
          { name: "Abdullah H. Kafi", start: { y: 2024, m: 9 }, count: 32, fee: 150 },
          { name: "Afrahul Haque Orko", start: { y: 2024, m: 9 }, count: 10, fee: 150, extra: 10 },
          { name: "Imtiaj Ahmed Rafi", start: { y: 2024, m: 9 }, count: 10, fee: 150 },
          { name: "Istique Ahmed Chomok", start: { y: 2024, m: 9 }, count: 4, fee: 150, fine: 100 },
          { name: "Junaed Hossain Toni", start: { y: 2024, m: 9 }, count: 37, fee: 150 },
          { name: "Kamrul H. Rafi", start: { y: 2024, m: 9 }, count: 25, fee: 150 },
          { name: "Khaled Mahmud", start: { y: 2024, m: 9 }, count: 27, fee: 150 },
          { name: "Mehedi Hasan Saikat", start: { y: 2025, m: 12 }, count: 5, fee: 100 },
          { name: "Sabbir Hossain", start: { y: 2024, m: 9 }, count: 32, fee: 150 }
        ];
        state.members = defs.map((d, i) => ({
          id: "mem_" + (i + 1),
          name: d.name,
          email: d.name.toLowerCase().replace(/[^a-z]+/g, ".") + "@gmail.com",
          avatar_url: null
        }));
        state.payments = [];
        const now = nowLocal();
        const nowIdx = monthIndex(now.getFullYear(), now.getMonth() + 1);

        defs.forEach((d, i) => {
          const startIdx = monthIndex(d.start.y, d.start.m);
          for (let step = 0; step < d.count; step++) {
            const curIdx = startIdx + step;
            const y = Math.floor(curIdx / 12);
            const m = (curIdx % 12) + 1;
            const isAdvance = curIdx > nowIdx;
            const amt = d.fee + (step === 0 && d.extra ? d.extra : 0);
            state.payments.push({
              id: uid("pay"),
              member_id: state.members[i].id,
              amount: amt,
              date: `${y}-${pad(m)}-05`,
              type: `${isAdvance ? "Advanced Fee" : "Monthly Fee"} (${MONTHS[m - 1]} ${y})`
            });
          }
          if (d.fine) {
            state.payments.push({
              id: uid("pay"),
              member_id: state.members[i].id,
              amount: d.fine,
              date: `${d.start.y}-${pad(d.start.m)}-15`,
              type: "Late Fine"
            });
          }
        });

        const y = YEAR();
        const dm = Math.max(1, now.getMonth());
        state.donations = [
          { id: uid("don"), description: "হরিপুরের প্রতিবন্ধী শিশুকে সাহায্য", date: `${y}-${pad(dm)}-22`, amount: 2000 },
          { id: uid("don"), description: "নিশ্চিন্তপুর এর ফয়েজ কে চিকিৎসার জন্য সাহায্য", date: `${y - 1}-12-13`, amount: 2000 },
          { id: uid("don"), description: "হীরাপুর জিহাদের গাড়ি এক্সিডেন্টে সাহায্য", date: `${y - 1}-11-18`, amount: 2000 },
          { id: uid("don"), description: "প্রাথমিক ত্রাণ ও সহায়তা", date: `${y - 2}-11-11`, amount: 1000 }
        ];
        state.settings = { ...DEFAULT_SETTINGS };
      },

      /* ---- members ---- */
      async addMember(payload) {
        if (sb) {
          /* always send our own id so tables without a default can still insert */
          const withId = { id: payload.id || uid("mem"), ...payload };
          let res = await sb.from("members").insert([withId]).select().single();
          /* older schema without an `email` column -> retry without it */
          if (res.error && /email/i.test(res.error.message || "")) {
            const bare = { ...withId }; delete bare.email;
            res = await sb.from("members").insert([bare]).select().single();
          }
          if (res.error) throw res.error;
          state.members.push(res.data);
          this.syncSheet("member", "add", res.data);
          notifyReportDataChanged();
          return res.data;
        }
        const row = { id: uid("mem"), ...payload };
        state.members.push(row); this.saveLocal();
        this.syncSheet("member", "add", row);
        notifyReportDataChanged();
        return row;
      },
      async updateMember(id, patch) {
        if (sb) {
          const { error } = await sb.from("members").update(patch).eq("id", id);
          if (error) throw error;
        }
        const i = state.members.findIndex(x => x.id === id);
        if (i > -1) state.members[i] = { ...state.members[i], ...patch };
        if (!sb) this.saveLocal();
        notifyReportDataChanged();
      },
      async deleteMember(id) {
        if (sb) {
          const { error } = await sb.from("members").delete().eq("id", id);
          if (error) throw error;
        }
        state.members = state.members.filter(m => m.id !== id);
        state.payments = state.payments.filter(p => p.member_id !== id);
        if (!sb) this.saveLocal();
        notifyReportDataChanged();
      },

      /* ---- payments ---- */
      async addPayment(payload) {
        if (sb) {
          /* send our own UUID so "null value in column id" can never happen */
          let res = await sb.from("payments")
            .insert([{ id: payload.id || newId(), ...payload }]).select().single();
          /* if the server generates ids itself, retry without ours */
          if (res.error && /column\s+"?id"?/i.test(res.error.message || "")) {
            res = await sb.from("payments").insert([payload]).select().single();
          }
          if (res.error) throw res.error;
          const data = res.data;
          state.payments.push(data);
          const mem = state.members.find(m => m.id === data.member_id);
          this.syncSheet("payment", "add", { ...data, member_name: mem ? mem.name : "" });
          notifyReportDataChanged();
          return data;
        }
        const row = { id: uid("pay"), ...payload };
        state.payments.push(row); this.saveLocal();
        const mem = state.members.find(m => m.id === row.member_id);
        this.syncSheet("payment", "add", { ...row, member_name: mem ? mem.name : "" });
        notifyReportDataChanged();
        return row;
      },
      async deletePayment(id) {
        if (sb) {
          const { error } = await sb.from("payments").delete().eq("id", id);
          if (error) throw error;
        }
        state.payments = state.payments.filter(p => p.id !== id);
        if (!sb) this.saveLocal();
        notifyReportDataChanged();
      },

      /* ---- donations ---- */
      async addDonation(payload) {
        if (sb) {
          /* id was missing here before — that's the "null value in column id" error */
          let res = await sb.from("donations")
            .insert([{ id: payload.id || newId(), ...payload }]).select().single();
          if (res.error && /column\s+"?id"?/i.test(res.error.message || "")) {
            res = await sb.from("donations").insert([payload]).select().single();
          }
          if (res.error) throw res.error;
          state.donations.unshift(res.data);
          this.syncSheet("donation", "add", res.data);
          return res.data;
        }
        const row = { id: uid("don"), ...payload };
        state.donations.unshift(row); this.saveLocal();
        this.syncSheet("donation", "add", row);
        return row;
      },
      async deleteDonation(id) {
        if (sb) {
          const { error } = await sb.from("donations").delete().eq("id", id);
          if (error) throw error;
        }
        state.donations = state.donations.filter(d => d.id !== id);
        if (!sb) this.saveLocal();
      },

      /* ---- Google Sheet mirror (does not block the app if the sheet is down) ---- */
      syncSheet(kind, action, row) {
        const url = (typeof SHEET_WEBHOOK_URL === "string") ? SHEET_WEBHOOK_URL.trim() : "";
        if (!url) return;
        const body = JSON.stringify({ kind, action, row });
        try {
          if (navigator.sendBeacon) {
            const blob = new Blob([body], { type: "text/plain;charset=UTF-8" });
            if (navigator.sendBeacon(url, blob)) return;
          }
        } catch (e) { /* fall through */ }
        fetch(url, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body
        }).catch(() => { /* sheet sync is best-effort */ });
      },

      /* ---- settings ---- */
      async saveSettings(patch) {
        state.settings = { ...state.settings, ...patch };
        if (sb) {
          const { error } = await sb.from("app_settings").upsert({ id: 1, ...state.settings });
          if (error) throw error;
        } else this.saveLocal();
      }
    };

    /* =====================================================================
       LIVE FEE-REPORT REFRESH
       - Local CRUD recalculates immediately from the in-memory ledger.
       - Other tabs/devices: Supabase Realtime + a visible-report polling
         fallback; local mode also listens for the localStorage event.
    ===================================================================== */
    let reportSignatureSeen = "";
    let reportUpdatedAt = Date.now();
    let reportRenderTimer = null;
    let reportFetchTimer = null;
    let reportFetchBusy = false;
    let reportRemoteCheckedAt = 0;
    let reportRealtimeChannel = null;

    function reportDataSignature() {
      const members = state.members.map(m => [m.id, m.name]).sort((a, b) => String(a[0]).localeCompare(String(b[0])));
      const payments = state.payments.map(p => [p.id, p.member_id, p.amount, p.date, p.type])
        .sort((a, b) => String(a[0]).localeCompare(String(b[0])));
      return JSON.stringify([members, payments]);
    }

    function reportFreshLabel() {
      return "আপডেট " + new Date(reportUpdatedAt).toLocaleTimeString("bn-BD", { hour: "numeric", minute: "2-digit" });
    }

    function refreshReportView() {
      if (!state.booted || path() !== "/report") return;
      const view = document.getElementById("view");
      const table = view && view.querySelector(".rp-scroll");
      const top = view ? view.scrollTop : 0;
      const left = table ? table.scrollLeft : 0;
      render();
      requestAnimationFrame(() => {
        const nextView = document.getElementById("view");
        const nextTable = nextView && nextView.querySelector(".rp-scroll");
        if (nextView) nextView.scrollTop = top;
        if (nextTable) nextTable.scrollLeft = left;
      });
    }

    function notifyReportDataChanged(force = false) {
      const signature = reportDataSignature();
      if (!force && signature === reportSignatureSeen) return;
      reportSignatureSeen = signature;
      reportUpdatedAt = Date.now();
      if (!state.booted || path() !== "/report") return;
      clearTimeout(reportRenderTimer);
      reportRenderTimer = setTimeout(refreshReportView, 40);
    }

    async function refreshReportFromServer() {
      if (reportFetchBusy || !sb || !state.session || state.session.user?.local || document.visibilityState !== "visible") return;
      reportFetchBusy = true;
      reportRemoteCheckedAt = Date.now();
      try {
        await db.fetchAll();
        notifyReportDataChanged();
        reportUpdatedAt = Date.now();
        refreshReportLabel();
      } catch (e) {
        console.warn("Report background refresh failed", e);
      } finally {
        reportFetchBusy = false;
      }
    }

    function queueReportServerRefresh() {
      clearTimeout(reportFetchTimer);
      reportFetchTimer = setTimeout(refreshReportFromServer, 250);
    }

    function ensureReportRealtime() {
      if (!sb || !state.session || state.session.user?.local || reportRealtimeChannel || !sb.channel) return;
      try {
        reportRealtimeChannel = sb.channel("healer-fee-report-live")
          .on("postgres_changes", { event: "*", schema: "public", table: "members" }, queueReportServerRefresh)
          .on("postgres_changes", { event: "*", schema: "public", table: "payments" }, queueReportServerRefresh)
          .subscribe();
      } catch (e) {
        console.warn("Fee report realtime unavailable; polling fallback remains active", e);
      }
    }

    function stopReportRealtime() {
      if (!reportRealtimeChannel || !sb) return;
      try { sb.removeChannel(reportRealtimeChannel); } catch (e) { }
      reportRealtimeChannel = null;
    }

    function enterReportFresh() {
      if (!sb || !state.session || state.session.user?.local) return;
      ensureReportRealtime();
      if (Date.now() - reportRemoteCheckedAt > 5000) queueReportServerRefresh();
    }

    window.addEventListener("storage", e => {
      if (e.key !== LS_DATA) return;
      db.loadLocal();
      notifyReportDataChanged(true);
    });

    /* =====================================================================
       DUES MATH
    ===================================================================== */
    function paymentMonthKey(p) {
      if (p.type) {
        const m = String(p.type).match(/\(([A-Za-z]+)\s+(\d{4})\)/);
        if (m) {
          const i = MONTHS.findIndex(x => x.toLowerCase() === m[1].toLowerCase());
          if (i > -1) return { y: Number(m[2]), m: i + 1 };
        }
      }
      if (p.date) {
        const [y, mo] = String(p.date).slice(0, 10).split("-");
        return { y: Number(y), m: Number(mo) };
      }
      return null;
    }

    /** sort key for a payment: the MONTH IT COVERS (e.g. "Advanced Fee (October 2025)"),
        not the day it was entered in the app. This keeps backfilled/advance payments in
        proper calendar order even when several were typed in on the same real date. */
    function paymentSortIndex(p) {
      const k = paymentMonthKey(p);
      if (k) return monthIndex(k.y, k.m);
      return monthIndex(1970, 1); // no date/type at all -> push to the very start
    }

    function paidSet(memberId, year, typeMatch) {
      const set = new Set();
      state.payments.forEach(p => {
        if (p.member_id !== memberId) return;
        if (typeMatch && !String(p.type || "").toLowerCase().includes(typeMatch.toLowerCase())) return;
        const k = paymentMonthKey(p);
        if (k && k.y === year) set.add(k.m);
      });
      return set;
    }

    function memberFee(memberId) {
      const rows = state.payments
        .filter(p => p.member_id === memberId && String(p.type || "").includes("Monthly Fee"))
        .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      return rows.length ? Number(rows[0].amount) : DEFAULT_FEE;
    }

    /** the member's LAST paid month, counting both Monthly Fee and Advanced Fee.
        Returns null when the member has never paid a fee. */
    function lastPaidIndex(memberId, typeMatch = "Monthly Fee") {
      const wantMonthly = !typeMatch || /monthly/i.test(typeMatch);
      let last = null;
      state.payments.forEach(p => {
        if (p.member_id !== memberId) return;
        const t = String(p.type || "");
        const ok = wantMonthly
          ? /Monthly Fee|Advanced Fee/i.test(t)
          : t.toLowerCase().includes(String(typeMatch).toLowerCase());
        if (!ok) return;
        const k = paymentMonthKey(p);
        if (!k) return;
        const i = monthIndex(k.y, k.m);
        if (last === null || i > last) last = i;
      });
      return last;
    }

    /** Months of `year` that are due. The range starts after the member's last
        paid month, or at FEE_START for a member with no fee payments at all. */
    function dueMonths(memberId, year, typeMatch = "Monthly Fee") {
      const y = YEAR();
      const cm = nowLocal().getMonth() + 1;
      const nowIdx = monthIndex(y, cm);
      const last = lastPaidIndex(memberId, typeMatch);
      const startIdx = last === null ? monthIndex(FEE_START.y, FEE_START.m) : last + 1;
      const endIdx = year < y ? monthIndex(year, 12) : (year > y ? -1 : nowIdx);
      /* Monthly + Advanced both count as "paid" for the month they name */
      const paid = /monthly/i.test(typeMatch || "Monthly Fee")
        ? new Set([...paidSet(memberId, year, "Monthly Fee"), ...paidSet(memberId, year, "Advanced Fee")])
        : paidSet(memberId, year, typeMatch);
      const out = [];
      for (let m = 1; m <= 12; m++) {
        const i = monthIndex(year, m);
        if (i < startIdx || i > endIdx) continue;
        if (paid.has(m)) continue;
        out.push(m);
      }
      return out;
    }

    /** All unpaid fee periods since the member's last paid month, including
        unpaid periods from previous calendar years through the current month. */
    function allDuePeriods(memberId) {
      const now = nowLocal();
      const endIdx = monthIndex(now.getFullYear(), now.getMonth() + 1);
      const last = lastPaidIndex(memberId, "Monthly Fee");
      const startIdx = last === null ? monthIndex(FEE_START.y, FEE_START.m) : last + 1;
      if (startIdx > endIdx) return [];

      const paid = new Set();
      state.payments.forEach(p => {
        if (p.member_id !== memberId || !/Monthly Fee|Advanced Fee/i.test(String(p.type || ""))) return;
        const k = paymentMonthKey(p);
        if (k) paid.add(monthIndex(k.y, k.m));
      });

      const out = [];
      for (let i = startIdx; i <= endIdx; i++) {
        if (!paid.has(i)) out.push({ index: i, y: Math.floor(i / 12), m: (i % 12) + 1 });
      }
      return out;
    }

    function duePeriodLabel(period) {
      return period ? `${MONTHS[period.m - 1]} ${period.y}` : "";
    }

    function duePeriodRangeLabel(periods) {
      if (!periods || !periods.length) return "";
      return periods.length === 1
        ? duePeriodLabel(periods[0])
        : `${duePeriodLabel(periods[0])} - ${duePeriodLabel(periods[periods.length - 1])}`;
    }

    function memberDues(memberId, typeMatch = "Monthly Fee") {
      const months = typeMatch === "Monthly Fee"
        ? allDuePeriods(memberId)
        : dueMonths(memberId, YEAR(), typeMatch).map(m => ({ y: YEAR(), m, index: monthIndex(YEAR(), m) }));
      const fee = typeMatch === "Monthly Fee" ? memberFee(memberId) : 100;
      return { months, count: months.length, amount: months.length * fee, fee };
    }

    /** status map for the 12-month grid on Member detail */
    function monthStatuses(memberId, year = YEAR()) {
      /* paid = Monthly OR Advanced fee for that month; due = only months after the last paid one */
      const paid = new Set([...paidSet(memberId, year, "Monthly Fee"), ...paidSet(memberId, year, "Advanced Fee")]);
      const dueSet = new Set(dueMonths(memberId, year, "Monthly Fee"));
      const cells = [];
      for (let m = 1; m <= 12; m++) {
        let st = "future";
        if (paid.has(m)) st = "paid";
        else if (dueSet.has(m)) st = "due";
        cells.push({ m, st });
      }
      return cells;
    }

    function duesList(typeMatch = "Monthly Fee") {
      const rows = state.members.map(m => {
        const d = memberDues(m.id, typeMatch);
        return { member: m, ...d };
      }).filter(r => r.count > 0);
      rows.sort((a, b) => b.count - a.count || a.member.name.localeCompare(b.member.name));
      return rows;
    }

    /* =====================================================================
       AGGREGATES
    ===================================================================== */
    function totals() {
      const collected = state.payments.reduce((a, p) => a + Number(p.amount || 0), 0);
      const donated = state.donations.reduce((a, d) => a + Number(d.amount || 0), 0);
      return { collected, donated, fund: collected - donated, payments: state.payments.length };
    }

    /** last n calendar months as {y, m} going back from this month, most recent last */
    function lastMonthKeys(n) {
      const base = nowLocal();
      const out = [];
      for (let i = n - 1; i >= 0; i--) {
        const d = new Date(base.getFullYear(), base.getMonth() - i, 1);
        out.push({ y: d.getFullYear(), m: d.getMonth() + 1 });
      }
      return out;
    }

    /** net fund collected within one calendar month ({y, m}), payments minus donations */
    function netForMonth(key) {
      let collected = 0, donated = 0;
      state.payments.forEach(p => {
        const k = paymentMonthKey(p);
        if (k && k.y === key.y && k.m === key.m) collected += Number(p.amount || 0);
      });
      state.donations.forEach(d => {
        const ds = String(d.date || "");
        if (Number(ds.slice(0, 4)) === key.y && Number(ds.slice(5, 7)) === key.m) donated += Number(d.amount || 0);
      });
      return collected - donated;
    }

    /** % change of this month's net fund vs last month's, for the hero card badge */
    function fundTrend() {
      const months = lastMonthKeys(2);
      const cur = netForMonth(months[1]);
      const prev = netForMonth(months[0]);
      if (!prev && !cur) return null;
      if (!prev) return { pct: 100, up: cur >= 0 };
      const pct = Math.round(((cur - prev) / Math.abs(prev)) * 100);
      return { pct: Math.abs(pct), up: pct >= 0 };
    }

    /** short, human category for a payment's raw type, e.g. "Monthly Fee (March 2026)" -> "Monthly dues" */
    function paymentTypeLabel(type) {
      const t = String(type || "");
      if (t.includes("Monthly Fee")) return "Monthly dues";
      if (t.includes("Advanced Fee")) return "Advance payment";
      if (t.includes("Late Fine")) return "Late fine";
      if (t.includes("Donation")) return "Donation";
      return t.split(" (")[0] || "Payment";
    }

    function recentActivity(n = 3) {
      const items = state.payments.map(p => {
        const mem = state.members.find(m => m.id === p.member_id);
        const k = paymentMonthKey(p);
        return {
          kind: "pay",
          title: mem ? mem.name : "Member",
          meta: k ? `${MONTHS[k.m - 1]} ${k.y}` : (p.date || ""),
          typeLabel: paymentTypeLabel(p.type),
          amount: Number(p.amount || 0),
          date: p.date || "",
          memberId: p.member_id
        };
      }).concat(state.donations.map(d => ({
        kind: "don",
        title: d.description || "Donation",
        meta: d.date || "",
        typeLabel: "Donation",
        amount: Number(d.amount || 0),
        date: d.date || "",
        memberId: null
      })));
      items.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      return items.slice(0, n);
    }

    /** d.MMM e.g. "Oct 5, 2025" to match the mockup's date style */
    function prettyDate(iso) {
      if (!iso) return "";
      const d = new Date(String(iso).length <= 10 ? iso + "T12:00:00" : iso);
      if (isNaN(d)) return esc(iso);
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }
