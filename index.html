      if (!btn) return;
      if (on) { btn.dataset.old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>' + (label ? `<span>${esc(label)}</span>` : ""); }
      else { btn.disabled = false; btn.innerHTML = btn.dataset.old || btn.innerHTML; }
    }

    /* =====================================================================
       COPY — one reusable routine (mirrors useCopy.js)
       Returns true when the value was actually copied.
    ===================================================================== */
    async function copyRaw(text) {
      const value = String(text == null ? "" : text);
      if (!value) return false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
          return true;
        }
      } catch (err) { /* fall through */ }
      try {
        const ta = document.createElement("textarea");
        ta.value = value;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, value.length);
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (err) { return false; }
    }

    function haptic(ms = 30) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { } }

    /* display-only grouping; the raw value stays ungrouped in the data */
    function groupDigits(raw) {
      return String(raw || "").replace(/\s+/g, "").replace(/(.{4})/g, "$1 ").trim();
    }

    /* screen-reader announcement for copy feedback */
    function announceCopy(msg) {
      const live = document.getElementById("payLive");
      if (live) { live.textContent = ""; setTimeout(() => { live.textContent = msg; }, 40); }
    }

    /* the shared "Copied" swap: label + check icon for 1.8s */
    function flashCopied(btn, normalHTML) {
      if (!btn) return;
      btn.innerHTML = ICONS.check.replace('width="16" height="16"', 'width="15" height="15"') + "<span>Copied</span>";
      btn.classList.add("pay-copied");
      clearTimeout(btn._copyTimer);
      btn._copyTimer = setTimeout(() => {
        btn.innerHTML = normalHTML;
        btn.classList.remove("pay-copied");
      }, 1800);
    }

    /**
     * Reusable copy action: copies, haptics, toasts, announces, flashes the button.
     * @param {string} key     unique key so several buttons can flash independently
     * @param {string} value   raw text to copy
     * @param {HTMLElement} btn  button to flash
     * @param {string} normalHTML the button's resting innerHTML
     * @param {string} toastMsg  toast + live-region message
     */
    async function useCopy(key, value, btn, normalHTML, toastMsg) {
      const ok = await copyRaw(value);
      if (ok) {
        haptic(30);
        flashCopied(btn, normalHTML);
        toast(toastMsg || "Copied to clipboard", "ok");
        announceCopy(toastMsg || "Copied to clipboard");
      } else {
        toast("Could not copy — long-press to select", "err");
      }
      return ok;
    }

    /* =====================================================================
       AUTH
    ===================================================================== */
    const LS_SESSION = "hb_session_v2";

    /* -------------------------------------------------------------------
       AUTO-LOGOUT POLICY
       Sessions live in sessionStorage only. The browser clears it when the
       app (tab / PWA window) is closed, so viewer AND admin are signed out
       automatically and land on the login page next time. A plain reload
       inside the open app keeps the session.
    ------------------------------------------------------------------- */
    const sessionStore = (() => {
      try { sessionStorage.setItem("__hb_t", "1"); sessionStorage.removeItem("__hb_t"); return sessionStorage; }
      catch (e) { return null; }
    })();

    /* one-time migration: any old persistent session is dropped */
    try { localStorage.removeItem(LS_SESSION); } catch (e) { }

    function saveLocalSession() {
      if (!sessionStore) return;
      try {
        if (state.session && state.session.user && state.session.user.local) {
          sessionStore.setItem(LS_SESSION, JSON.stringify(state.session.user));
        } else {
          sessionStore.removeItem(LS_SESSION);
        }
      } catch (e) { }
    }

    function restoreLocalSession() {
      if (!sessionStore) return false;
      try {
        const raw = sessionStore.getItem(LS_SESSION);
        if (!raw) return false;
        const user = JSON.parse(raw);
        if (!user || !user.local) return false;
        state.session = { user };
        state.isAdmin = String(user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase();
        return true;
      } catch (e) { return false; }
    }

    function clearAllSessions() {
      try { sessionStore && sessionStore.removeItem(LS_SESSION); } catch (e) { }
      try { localStorage.removeItem(LS_SESSION); } catch (e) { }
    }

    async function initAuth() {
      if (!sb) return;

      // A local viewer/admin session wins: Supabase must not wipe it.
      const hadLocal = restoreLocalSession();

      const { data } = await sb.auth.getSession();
      if (!hadLocal) setSession(data ? data.session : null);

      sb.auth.onAuthStateChange((_event, s) => {
        // Ignore Supabase null-events while a local session is in charge,
        // otherwise INITIAL_SESSION/SIGNED_OUT instantly logs the user out.
        const localActive = !!(state.session && state.session.user && state.session.user.local);
        if (localActive && (!s || !s.user)) return;
        setSession(s);
        saveLocalSession();
        if (s && s.user && !s.user.local) ensureReportRealtime();
        else stopReportRealtime();
        route();
      });
    }

    function setSession(session) {
      state.session = session;
      const email = session?.user?.email || "";
      state.isAdmin = !!email && email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
      saveLocalSession();
    }

    async function googleProviderOn() {
      try {
        const res = await fetch(SUPABASE_URL + "/auth/v1/settings", {
          headers: { apikey: SUPABASE_ANON_KEY }
        });
        const data = await res.json();
        return !!(data && data.external && data.external.google);
      } catch (e) {
        return false;
      }
    }

    function openAsViewer() {
      state.session = { user: { email: "", user_metadata: { name: "Viewer" }, local: true } };
      state.isAdmin = false;
      saveLocalSession();
    }

    async function loadLiveData() {
      if (!sb) return;
      await db.fetchAll();
    }

    async function signInGoogle() {
      // Google provider is disabled on this Supabase project. Calling it returns
      // {"error_code":"validation_failed","msg":"Unsupported provider: provider is not enabled"}
      // and replaces the app with that raw JSON page. Never redirect there.
      openAsViewer();
      try { await loadLiveData(); } catch (e) { console.error(e); }
      route();
      toast("Google sign-in is off, so you are in as a viewer.", "ok");
    }

    async function signInAdmin(email, password) {
      const emailOk = email.trim().toLowerCase() === ADMIN_EMAIL.toLowerCase();
      const passOk = password === ADMIN_PASSWORD;
      if (!emailOk || !passOk) throw new Error("Wrong admin Gmail or password.");

      // Works even if the Supabase Auth user was never confirmed.
      state.session = { user: { email: ADMIN_EMAIL, user_metadata: { name: "Healer Boy's Admin" }, local: true } };
      state.isAdmin = true;
      saveLocalSession();

      if (sb) {
        try {
          const { error } = await sb.auth.signInWithPassword({ email: ADMIN_EMAIL, password });
          if (!error) {
            const { data } = await sb.auth.getSession();
            if (data && data.session) setSession(data.session);
          }
          await loadLiveData();
        } catch (e) {
          console.error(e);
        }
      }
    }

    async function signOut() {
      clearAllSessions();
      if (sb) { try { await sb.auth.signOut(); } catch (e) { } }
      state.session = null; state.isAdmin = false;
      try { localStorage.removeItem(LS_DATA); } catch (e) { }
      navigate("/login");
      toast("Signed out");
    }

    function requireAuth() { return !!state.session; }

    /* =====================================================================
       EMAILJS
    ===================================================================== */
    async function sendReminderEmail(member, monthLabel, amount) {
      const to_email = member.email || `${member.name.toLowerCase().replace(/[^a-z]+/g, ".")}@gmail.com`;
      const body = `Hi ${member.name}, your fee for ${monthLabel} is still due: ${taka(amount)}. Please pay by bKash or Nagad: ${state.settings.bkash_number || "-"} / ${state.settings.nagad_number || "-"}.`;
      if (!emailJSReady()) { await sleep(800); return { simulated: true, to_email, body }; }
      const res = await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        to_name: member.name,
        to_email,
        subject: "Monthly fee reminder",
        message: body,
        month: monthLabel,
        amount: String(amount),
        bkash: state.settings.bkash_number || "",
        nagad: state.settings.nagad_number || ""
      });
      return { simulated: false, to_email, body, res };
    }

    async function remindOne(member, btn) {
      if (!state.isAdmin) { toast("Only the admin can send reminders", "err"); return; }
      const dues = memberDues(member.id);
      if (!dues.count) { toast("No dues for this member", "ok"); return; }
      const label = duePeriodLabel(dues.months[0]);
      busy(btn, true, "Sending");
      try {
        const r = await sendReminderEmail(member, label, dues.fee);
        toast(r.simulated ? `Reminder queued for ${member.name} (EmailJS not configured)` : `Reminder sent to ${member.name}`, r.simulated ? "" : "ok");
      } catch (e) {
        toast("Send failed: " + (e && e.text ? e.text : e.message), "err");
      } finally { busy(btn, false); }
    }

    async function sendAllReminders(btn) {
      if (!state.isAdmin) return navigate("/reminders");
      const list = duesList("Monthly Fee");
      if (!list.length) { toast("Nobody has dues right now", "ok"); return; }
      busy(btn, true, `Sending 0/${list.length}`);
      let ok = 0;
      for (let i = 0; i < list.length; i++) {
        const r = list[i];
        btn.innerHTML = `<span class="spinner"></span><span>Sending ${i + 1}/${list.length}</span>`;
        try {
          await sendReminderEmail(r.member, duePeriodLabel(r.months[0]), r.fee);
          ok++;
        } catch (e) { console.error(e); }
        await sleep(350); // be gentle with the EmailJS rate limit
      }
      try {
        await db.saveSettings({ last_sent_at: new Date().toISOString(), last_sent_count: ok });
      } catch (e) { toast("Could not save last-sent time", "err"); }
      busy(btn, false);
      toast(`Sent to ${ok} member${ok === 1 ? "" : "s"}`, "ok");
      render();
    }

    /* =====================================================================
       PDF RECEIPT (generated locally, no dependency)
    ===================================================================== */
    function pdfEsc(s) { return String(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)"); }

    function buildReceiptPdf(member) {
      const pays = state.payments
        .filter(p => p.member_id === member.id)
        .sort((a, b) => paymentSortIndex(b) - paymentSortIndex(a) || (b.date || "").localeCompare(a.date || ""));
      const total = pays.reduce((a, p) => a + Number(p.amount || 0), 0);
      const dues = memberDues(member.id);
      const t = totals();

      const ops = [];
      const T = (x, y, size, text, bold) =>
        ops.push(`BT /${bold ? "F2" : "F1"} ${size} Tf ${x} ${y} Td (${pdfEsc(text)}) Tj ET`);
      const L = (x1, y, x2) => ops.push(`${x1} ${y} m ${x2} ${y} l S`);

      T(56, 780, 20, "HEALER BOY'S", true);
      T(56, 762, 9.5, "Community fund receipt", false);
      L(56, 752, 539);
      T(56, 730, 11, "Member", true);
      T(56, 714, 13, member.name, true);
      T(56, 698, 9.5, `Member ID: ${member.id}`, false);
      T(380, 730, 11, "Issued", true);
      T(380, 714, 9.5, new Date().toISOString().slice(0, 10), false);

      let y = 668;
      T(56, y, 10, "DATE", true); T(160, y, 10, "DESCRIPTION", true); T(460, y, 10, "AMOUNT (BDT)", true);
      y -= 6; L(56, y, 539); y -= 16;
      pays.slice(0, 22).forEach(p => {
        T(56, y, 9.5, p.date || "-", false);
        T(160, y, 9.5, String(p.type || "Fee").slice(0, 44), false);
        T(539, y, 9.5, Number(p.amount || 0).toLocaleString("en-US"), false);
        y -= 15;
      });
      if (!pays.length) { T(56, y, 9.5, "No payments recorded yet.", false); y -= 15; }
      y -= 6; L(56, y, 539); y -= 18;
      T(160, y, 11, "TOTAL PAID", true); T(539, y, 11, total.toLocaleString("en-US"), true);
      y -= 16;
      T(160, y, 10, `Months still due (${YEAR()})`, false);
      T(539, y, 10, dues.count ? `${dues.count} month(s) - BDT ${dues.amount.toLocaleString("en-US")}` : "None", false);
      y -= 16;
      T(160, y, 10, "Club fund balance", false); T(539, y, 10, t.fund.toLocaleString("en-US"), false);

      L(56, y - 20, 539);
      T(56, y - 38, 8.5, "Pay by bKash " + (state.settings.bkash_number || "-") + "  or  Nagad " + (state.settings.nagad_number || "-"), false);
      T(56, y - 50, 8.5, "Generated by Healer Boy's fund tracker.", false);

      const content = ops.join("\n");
      const objs = [
        "<< /Type /Catalog /Pages 2 0 R >>",
        "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
        "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>",
        "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
        "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>",
        `<< /Length ${content.length} >>\nstream\n${content}\nendstream`
      ];
      let out = "%PDF-1.4\n";
      const offs = [];
      objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
      const xref = out.length;
      out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
      offs.forEach(o => { out += String(o).padStart(10, "0") + " 00000 n \n"; });
      out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
      return out;
    }

    function downloadReceipt(member) {
      try {
        const pdf = buildReceiptPdf(member);
        const blob = new Blob([pdf], { type: "application/pdf" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `receipt-${member.name.replace(/\s+/g, "-").toLowerCase()}.pdf`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        toast("Receipt downloaded", "ok");
      } catch (e) { toast("Could not build PDF", "err"); }
    }

    /* =====================================================================
       ROUTER
    ===================================================================== */
    const NAV = [
      { path: "/home", label: "Home", icon: "home" },
      { path: "/pay", label: "Payment", icon: "cardNav" },
      { path: "/members", label: "Members", icon: "users" },
      { path: "/donations", label: "Donation", icon: "heart" },
      { path: "/profile", label: "Profile &amp; Settings", icon: "user", long: true }
    ];
    const NAV_PATHS = NAV.map(n => n.path);
    /* sub-pages that belong to a tab: highlight the parent, keep nav visible.
       /dues has no tab of its own any more; it opens from the Home "Dues" card. */
    const NAV_PARENT = { "/member": "/members", "/report": "/members", "/dues": "/home", "/reminders": "/profile" };

    function navIndexFor(p) {
      const exact = NAV.findIndex(n => n.path === p);
      if (exact > -1) return exact;
      for (const key in NAV_PARENT) {
        if (p === key || p.startsWith(key + "/")) {
          const i = NAV.findIndex(n => n.path === NAV_PARENT[key]);
          if (i > -1) return i;
        }
      }
      return 0;
    }

    function path() {
      const h = (location.hash || "").replace(/^#/, "");
      return h || "/home";
    }
    function navigate(p) { location.hash = p; }

    /* ---- liquid glass hooks (presentation only; no data/​auth/​logic) ---- */
    const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let fundCounted = false;

    function navButtonHTML(n, active, duesCount) {
      return `${ICONS[n.icon]}<span class="nav-lbl${n.long ? " nav-lbl-long" : ""}">${n.label}</span>`;
    }

    function renderNav() {
      const nav = document.getElementById("nav");
      const p = path();
      const idx = navIndexFor(p);
      const show = NAV_PATHS.includes(p) || p.startsWith("/member/") || p === "/dues" || p === "/reminders" || p === "/report";
      nav.style.setProperty("--tab", idx);
      nav.classList.toggle("show", show && requireAuth());

      if (!nav.classList.contains("show")) {
        nav.innerHTML = "";
        nav.dataset.built = "";
        return;
      }

      const duesCount = duesList("Monthly Fee").length;

      if (nav.dataset.built !== "1") {
        /* first build: pill + buttons (starts settled on the active tab) */
        nav.innerHTML = `<div class="nav-pill" aria-hidden="true"><div class="nav-pill-in"></div></div>` +
          NAV.map(n => {
            const active = navIndexFor(p) === NAV.findIndex(x => x.path === n.path);
            return `<button class="nav-btn nav-item ${active ? "active" : ""}" data-nav="${n.path}" aria-current="${active}">${navButtonHTML(n, active, duesCount)}</button>`;
          }).join("");
        nav.dataset.built = "1";
        nav.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => {
          const pill = nav.querySelector(".nav-pill");
          if (pill && !REDUCED && b.dataset.nav !== path()) {
            pill.classList.remove("moving");
            void pill.offsetWidth; /* restart the stretch keyframe */
            pill.classList.add("moving");
            setTimeout(() => pill.classList.remove("moving"), 360);
          }
          navigate(b.dataset.nav);
        });
      } else {
        /* refresh in place so the pill element survives and can slide */
        const cur = navIndexFor(p);
        nav.querySelectorAll("[data-nav]").forEach((b, i) => {
          const active = i === cur;
          b.classList.toggle("active", active);
          b.setAttribute("aria-current", String(active));
        });
        const memDef = NAV.find(n => n.path === "/members");
        const memBtn = nav.querySelector('[data-nav="/members"]');
        if (memBtn && memDef) memBtn.innerHTML = navButtonHTML(memDef, cur === NAV.findIndex(x => x.path === "/members"), duesCount);
      }
    }

    /* first load only: total fund counts up from 0 (800ms ease-out) */
    function countFundUp() {
      const el = document.getElementById("fundBig");
      if (!el || fundCounted) return;
      fundCounted = true;
      const target = totals().fund;
      if (REDUCED || !target) { el.textContent = fmtNumOnly(target); return; }
      const t0 = performance.now(), dur = 800;
      el.textContent = fmtNumOnly(0);
      (function frame(now) {
        if (!el.isConnected) return;
        const k = Math.min(1, (now - t0) / dur);
        const eased = 1 - Math.pow(1 - k, 3);
        el.textContent = fmtNumOnly(Math.round(target * eased));
        if (k < 1) requestAnimationFrame(frame);
      })(t0);
    }

    function route() {
      const p = path();
      if (!requireAuth() && p !== "/login") return navigate("/login");
      if (requireAuth() && p === "/login") return navigate("/home");
      /* the Profile tab is inside NAV, so it is a normal route (no admin gate) */
      if (p === "/reminders" && !state.isAdmin) return navigate("/home");
      render();
      const view = document.getElementById("view");
      if (p !== "/home") view.scrollTop = 0;
    }

    function render() {
      renderNav();
      const p = path();
      const v = document.getElementById("view");
      let html = "";
      if (p === "/login") html = ScreenLogin();
      else if (p === "/home") html = ScreenHome();
      else if (p === "/members") html = ScreenMembers();
      else if (p.startsWith("/member/")) html = ScreenMemberDetail(p.split("/")[2]);
      else if (p === "/donations") html = ScreenDonations();
      else if (p === "/dues") html = ScreenDues();
      else if (p === "/reminders") html = ScreenReminders();
      else if (p === "/report") html = ScreenReport();
      else if (p === "/pay") html = ScreenPay();
      else if (p === "/profile") html = ScreenProfile();
      else html = ScreenHome();
      v.innerHTML = html;
      bind(p);
      bindPaymentOptions(v);
      if (p === "/home") countFundUp();
      if (p === "/report") enterReportFresh();

      /* floating "+ Add member": Members tab only, admin only (RLS blocks viewers anyway) */
      const fabHost = document.getElementById("fabHost");
      if (fabHost) {

          fabHost.innerHTML = `<button class="mb-fab" id="addMemberFab" type="button" aria-label="Add member">

          const fab = fabHost.querySelector("#addMemberFab");
          if (fab) fab.onclick = openAddMember;

    }

    /* =====================================================================
       MEMBERS LIST
    ===================================================================== */
    /* card tints: each member card fades from white into one of these at bottom-right */
    /* =====================================================================
       FEE REPORT — per-member paid / due table (Bengali), copy to Excel / CSV
       Everything is computed from the real payments, nothing is typed in.
    ===================================================================== */
    /* FEE_START is defined with the top-level CONSTANTS */
    const BN_DIG = "০১২৩৪৫৬৭৮৯";
    const BN_SHORT = ["জানু", "ফেব্রু", "মার্চ", "এপ্রি", "মে", "জুন", "জুল", "আগ", "সেপ", "অক্টো", "নভেম", "ডিসে"];
    const BN_FULL = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];
    const REPORT_HEAD = ["নাম", "পরিশোধিত সময়কাল", "পরিশোধিত মাস", "প্রতি মাসের ফি (টাকা)", "মোট পরিশোধিত (টাকা)", "বকেয়া সময়কাল", "বকেয়া মাস", "মোট বকেয়া (টাকা)", "স্ট্যাটাস"];
    const bnNum = (n) => String(n).replace(/\d/g, d => BN_DIG[d]);
    const bnMoney = (n) => bnNum(Number(n || 0).toLocaleString("en-US"));
    const mIdx = (y, m) => y * 12 + (m - 1);
    const idxBn = (i) => `${BN_SHORT[i % 12]} ${bnNum(Math.floor(i / 12))}`;
    const rangeBn = (a, b) => a === b ? idxBn(a) : `${idxBn(a)} — ${idxBn(b)}`;

    function feeReport() {
      const now = nowLocal();
      const cur = mIdx(now.getFullYear(), now.getMonth() + 1);
      const rows = state.members.map(m => {
        const pays = state.payments.filter(p => p.member_id === m.id);
        const feePays = pays.filter(p => /Monthly Fee|Advanced Fee/i.test(String(p.type || "")));
        const paid = new Set();
        const amounts = {};
        feePays.forEach(p => {
          const k = paymentMonthKey(p);
          if (!k) return;
          paid.add(mIdx(k.y, k.m));
          const a = Number(p.amount || 0);
          amounts[a] = (amounts[a] || 0) + 1;
        });
        /* monthly fee = the amount this member pays most often */
        let fee = DEFAULT_FEE, best = 0;
        Object.keys(amounts).forEach(a => { if (amounts[a] > best) { best = amounts[a]; fee = Number(a); } });
        const fines = pays.filter(p => /Late Fine/i.test(String(p.type || ""))).reduce((s, p) => s + Number(p.amount || 0), 0);
        const totalPaid = pays.reduce((s, p) => s + Number(p.amount || 0), 0);
        const sorted = [...paid].sort((a, b) => a - b);
        const first = sorted.length ? sorted[0] : null;
        const last = sorted.length ? sorted[sorted.length - 1] : null;
        /* dues start the month AFTER the last paid month; paid-ahead members owe nothing.
           A member who never paid owes from the fee start month. */
        const start = last != null ? last + 1 : mIdx(FEE_START.y, FEE_START.m);
        const missing = [];
        for (let i = start; i <= cur; i++) if (!paid.has(i)) missing.push(i);
        const status = missing.length ? "due" : (last != null && last > cur ? "advance" : "ok");
        return { m, fee, fines, totalPaid, paidCount: paid.size, first, last, missing, dueAmount: missing.length * fee, status };
      });
      rows.sort((a, b) => a.m.name.localeCompare(b.m.name));
      return { rows, cur, now };
    }

    function reportCells(r) {
      const paidPeriod = r.first != null ? rangeBn(r.first, r.last) : "-";
      const feeTxt = bnMoney(r.fee) + (r.fines ? ` (+${bnMoney(r.fines)} ফাইন)` : "");
      const duePeriod = r.missing.length ? rangeBn(r.missing[0], r.missing[r.missing.length - 1]) : "-";
      const status = { due: "বকেয়া আছে", advance: "অগ্রিম দেওয়া", ok: "হালনাগাদ" }[r.status];
      return [r.m.name, paidPeriod, bnNum(r.paidCount), feeTxt, bnMoney(r.totalPaid), duePeriod, bnNum(r.missing.length), bnMoney(r.dueAmount), status];
    }

    function reportTSV() {
      const { rows } = feeReport();
      return [REPORT_HEAD, ...rows.map(reportCells)].map(r => r.join("\t")).join("\n");
    }

    function downloadReportCsv() {
      const { rows } = feeReport();
      const q = s => `"${String(s).replace(/"/g, '""')}"`;
      const csv = "\uFEFF" + [REPORT_HEAD, ...rows.map(reportCells)].map(r => r.map(q).join(",")).join("\r\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `member-fee-report-${todayISO()}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("CSV ডাউনলোড হয়েছে", "ok");
    }

    function ScreenReport() {
      const { rows, now } = feeReport();
      const totalPaid = rows.reduce((a, r) => a + r.totalPaid, 0);
      const totalDue = rows.reduce((a, r) => a + r.dueAmount, 0);
      const dueN = rows.filter(r => r.status === "due").length;
      const stCls = { due: "due", advance: "adv", ok: "ok" };
      reportSignatureSeen = reportDataSignature();

      return `<div class="screen rp-screen">
      <div class="mb-head">
        <button class="mb-back" data-go="/members" aria-label="Back to members">${ICONS.back}</button>

      <div class="rp-sum">

        <div class="rp-sum-card"><p class="rp-sum-label">বকেয়া সদস্য</p><p class="rp-sum-val cnt">${bnNum(dueN)} জন</p></div>
      </div>

      <div class="rp-actions">
        <button class="rp-btn primary" id="rpCopyBtn" type="button" aria-label="রিপোর্ট কপি করুন, Excel-এ পেস্ট করার জন্য">${ICONS.doc}<span>Excel-এ কপি</span></button>
        <button class="rp-btn" id="rpCsvBtn" type="button" aria-label="CSV ফাইল ডাউনলোড করুন">${ICONS.doc}<span>CSV ডাউনলোড</span></button>
      </div>

      <p class="rp-hint">ডানে স্ক্রল করে সব কলাম দেখুন</p>

      <div class="rp-scroll" role="region" aria-label="সদস্য ফি রিপোর্ট টেবিল" tabindex="0">
        <table class="rp">
          <thead><tr>${REPORT_HEAD.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => {
              const c = reportCells(r);
              return `<tr>
                <th scope="row">${esc(c[0])}</th>
                <td>${esc(c[1])}</td>
                <td class="r">${esc(c[2])}</td>
                <td>${esc(c[3])}</td>
                <td class="r amt-paid">${esc(c[4])}</td>
                <td>${esc(c[5])}</td>
                <td class="r">${esc(c[6])}</td>
                <td class="r ${r.dueAmount ? "amt-due" : ""}">${esc(c[7])}</td>
                <td><span class="rp-st ${stCls[r.status]}">${esc(c[8])}</span></td>
              </tr>`;
            }).join("") : `<tr><td colspan="9" style="text-align:center;padding:24px">কোনো সদস্য নেই</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;
    }

    const MEMBER_TINTS = ["#EDE9FE", "#FCE7F3", "#D1FAE5", "#DBEAFE", "#FFEDD5"];

    /* one pass over members: status, dues, paid totals, activity */
    function memberRows() {
      const yr = YEAR();
      return state.members.map(m => {
        const dues = memberDues(m.id);
        const pays = state.payments.filter(p => p.member_id === m.id);
        return {
          m,
          due: dues.count > 0,
          dueAmount: dues.amount,
          paidTotal: pays.reduce((a, p) => a + Number(p.amount || 0), 0),
          active: pays.some(p => { const k = paymentMonthKey(p); return !!k && k.y === yr; })
        };
      });
    }

    function ScreenMembers() {
      const rows = memberRows();
      const total = rows.length;
      const activeN = rows.filter(r => r.active).length;

      const paidN = total - dueN;
      const q = state.memberQuery.trim().toLowerCase();

      let list = rows.filter(r => !q || r.m.name.toLowerCase().includes(q));
      if (state.memberFilter === "paid") list = list.filter(r => !r.due);

      list = list.slice().sort((a, b) => {

        if (state.memberSort === "name") return a.m.name.localeCompare(b.m.name);
        /* default: whoever paid the most is first; ties fall back to name */
        return (b.paidTotal - a.paidTotal) || a.m.name.localeCompare(b.m.name);
      });
      const topPayerId = (list.length && state.memberSort === "paid" && list[0].paidTotal > 0) ? list[0].m.id : null;
      const SORT_LABEL = { paid: "top payer first", due: "highest due first", name: "A to Z" };

      const filters = [["all", "All", total], ["paid", "Paid", paidN], ["due", "Due", dueN]];

      return `<div class="screen mb-screen">

        ${ICONS.doc}<span>ফি ও বকেয়া রিপোর্ট (টেবিল)</span>
      </button>

      <div class="mb-list">
        ${list.length ? list.map((r, i) => `
          <button class="mb-card" type="button" data-member="${r.m.id}" style="--tint:${MEMBER_TINTS[i % MEMBER_TINTS.length]}"
            aria-label="${esc(r.m.name)}, ${r.due ? "due " + taka(r.dueAmount) : "paid"}">
            <span class="mb-av" ${r.m.avatar_url ? `style="background-image:url('${esc(r.m.avatar_url)}')"` : ""}>${r.m.avatar_url ? "" : initials(r.m.name)}</span>
            <span class="mb-main">

              <span class="mb-meta">

                <span class="mb-paid num">Total paid ${taka(r.paidTotal)}</span>
              </span>
            </span>
            ${r.due
              ? `<span class="mb-pill due"><span class="mb-dot" style="background:currentColor"></span>Due ${taka(r.dueAmount)}</span>`
              : `<span class="mb-pill paid">${ICONS.check.replace('width="16" height="16"', 'width="12" height="12"')}<span>Paid</span></span>`}

        : `<div class="mb-empty">No members match this filter.</div>`}
      </div>

      ${state.isAdmin ? `<form class="mb-add" id="addMemberCard" hidden>

        </div>

            </span>

    /* admin: the floating "+ Add member" button reveals the form and focuses it */

    /* =====================================================================
       SCREEN 3 — MEMBER DETAIL
    ===================================================================== */
    /* colour + icon per payment type, for the payment-history list */
    function payTypeMeta(type) {
      const t = String(type || "");
      if (t.includes("Late Fine"))   return { color: "#E11D48", soft: "#FFE4E9", icon: ICONS.alert };
      if (t.includes("Advanced"))    return { color: "#0284C7", soft: "#E0F2FE", icon: ICONS.bank };
      if (t.includes("Donation"))    return { color: "#DB2777", soft: "#FCE7F3", icon: ICONS.heart };
      if (t.includes("Monthly") || t.includes("Fee")) return { color: "#4F46E5", soft: "#EEF2FF", icon: ICONS.wallet };
      return { color: "#EA580C", soft: "#FFF7ED", icon: ICONS.doc };
    }
    /* friendly "May 2026" label from a month index {y,m} */
    function payMonthLabel(p) {
      const k = paymentMonthKey(p);
      return k ? `${MONTHS[k.m - 1]} ${k.y}` : "";
    }
    /** "For month" dropdown: Sep 2024 → Aug 2027 (past, this year, and 2 years ahead) */
    function payMonthOptions() {
      const now = nowLocal();
      const start = monthIndex(FEE_START.y, FEE_START.m);
      const end = monthIndex(now.getFullYear() + 2, now.getMonth() + 1);
      const cur = monthIndex(now.getFullYear(), now.getMonth() + 1);
      let out = "";
      for (let i = start; i <= end; i++) {
        const y = Math.floor(i / 12), m = (i % 12) + 1;
        out += `<option value="${y}-${m}">${MONTHS[m - 1]} ${y}</option>`;
      }
      /* remember selection between renders */
      if (state.payMonthSel) out = out.replace(
        `value="${state.payMonthSel}"`,
        `value="${state.payMonthSel}" selected`);
      else out = out.replace(`value="${now.getFullYear()}-${now.getMonth() + 1}"`,
        `value="${now.getFullYear()}-${now.getMonth() + 1}" selected`);
      return out;
    }

    function timeAgoLabel(iso) {
      if (!iso) return "";
      const d = new Date(String(iso).length <= 10 ? iso + "T12:00:00" : iso);
      if (isNaN(d)) return "";
      const diff = Math.floor((Date.now() - d.getTime()) / 86400000);
      if (diff <= 0) return "today";
      if (diff === 1) return "yesterday";
      if (diff < 30) return diff + "d ago";
      if (diff < 365) return Math.floor(diff / 30) + "mo ago";
      return Math.floor(diff / 365) + "y ago";
    }

      const history = state.payments.filter(p => p.member_id === m.id)

          <p class="sub" style="font-size:11.5px">${history.length} payment${history.length === 1 ? "" : "s"}</p>

        <div class="stat" style="cursor:default">

        </div>

      <div class="stack" style="margin-top:14px">
        <button class="btn btn-primary" id="remindBtn" ${state.isAdmin ? "" : "disabled"}>
          ${state.isAdmin ? ICONS.mail + "<span>Send reminder by email</span>"

      </div>
      ${state.isAdmin ? "" : `<p class="sub center" style="font-size:11px;margin-top:8px">Reminders can only be sent by the admin.</p>`}

      ${state.isAdmin ? `<div class="card" style="margin-top:12px">
        <p class="eyebrow">Record a payment</p>
        <form id="payForm" style="margin-top:10px">
          <div class="g2" style="margin-bottom:10px">
            <div>
              <label class="label" for="pType">Type</label>
              <select class="field" id="pType" style="padding-right:8px">${PAY_TYPES.map(t => `<option>${t}</option>`).join("")}</select>
            </div>

      </div>` : ""}

      <div class="hist-card" style="margin-top:12px">
        <div class="hist-head">
          <div>
            <p class="eyebrow">Payment history</p>
            <p class="hist-count num">${history.length} record${history.length === 1 ? "" : "s"} &middot; ${taka(paid)} total</p>
          </div>
        </div>
        <div class="hist-list">
          ${history.length ? history.map((p, i) => {
          const meta = payTypeMeta(p.type);

          return `<div class="hist-item" style="--tint:${meta.color};--tint-soft:${meta.soft};animation-delay:${Math.min(i * 35, 300)}ms">

    /* =====================================================================
       DONATIONS
    ===================================================================== */
    function ScreenDonations() {
      const q = state.donQuery.toLowerCase();

        .filter(d => String(d.description || "").toLowerCase().includes(q))
        .slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));

          <span class="don-hero-chip">${ICONS.gift.replace('width="18" height="18"', 'width="14" height="14"')}<span>${state.donations.length} gift${state.donations.length === 1 ? "" : "s"}</span></span>
        </div>
      </section>

      <div class="with-icon" style="margin-top:12px">
        ${ICONS.search}
        <input class="field" id="donSearch" type="search" placeholder="Search donation note"
          value="${esc(state.donQuery)}" aria-label="Search donation note" />
      </div>

      ${(() => {
        if (!list.length) return `<div class="card" style="margin-top:12px"><p class="sub" style="padding:10px 0">No donations recorded yet.</p></div>`;
        const groups = [];
        list.forEach(d => {

          if (!g || g.year !== y) { g = { year: y, items: [], sum: 0 }; groups.push(g); }

          g.sum += Number(d.amount || 0);

          <div class="don-year-head">
            <span class="don-year-label">${esc(g.year)}</span>
            <span class="don-year-sum num">${taka(g.sum)}</span>

            const ago = timeAgoLabel(d.date);
            return `<article class="don-item">
              <span class="don-dot" aria-hidden="true"></span>

    /* shared by the /pay screen and the Profile card */
    function bindPaymentOptions(scope) {
      const card = scope.querySelector("#payCard");
      if (!card) return;
      const first = BANK_ACCOUNTS[0];

      const head = scope.querySelector("#payHead");
      if (head) head.onclick = () => {
        const open = card.classList.toggle("open");
        card.setAttribute("aria-expanded", String(open));
        head.setAttribute("aria-expanded", String(open));
      };

      const copyBtn = scope.querySelector("#copyAccBtn");
      if (copyBtn && first) {
        const normal = copyBtn.innerHTML;
        copyBtn.onclick = () => useCopy("acc", first.number, copyBtn, normal, "Account number copied");
      }

      /* the account number printed on the card is itself a copy button */
      scope.querySelectorAll("[data-copyacc]").forEach(b => {
        const a = (BANK_ACCOUNTS || []).find(x => x.id === b.dataset.copyacc);
        if (!a) return;
        const normal = b.innerHTML;
        b.onclick = () => useCopy(a.id, a.number, b, normal, "Account number copied");
      });

      const shareBtn = scope.querySelector("#shareAccBtn");
      if (shareBtn && first) {
        const normal = shareBtn.innerHTML;
        shareBtn.onclick = async () => {
          const text = `${first.bank}, ${first.holder}, ${first.number}`;
          if (navigator.share) {
            try { await navigator.share({ title: first.bank, text }); return; }
            catch (e) { if (e && e.name === "AbortError") return; }
          }
          useCopy("share", text, shareBtn, normal, "Account details copied");
        };
      }

      /* admin: add / update wallet numbers any time */
      const wf = scope.querySelector("#walletForm");
      if (wf) wf.onsubmit = async e => {
        e.preventDefault();
        const btn = wf.querySelector("button[type=submit]");
        busy(btn, true, "Saving");
        try {
          await db.saveSettings({
            bkash_number: scope.querySelector("#wBkash").value.trim(),
            nagad_number: scope.querySelector("#wNagad").value.trim()
          });
          toast("Wallet numbers saved", "ok");
          render();
        } catch (ex) {
          toast("Could not save: " + ex.message, "err");
        } finally { busy(btn, false); }
      };

      scope.querySelectorAll("[data-copych]").forEach(b => {
        const ch = extraChannels().find(x => x.id === b.dataset.copych);
        if (!ch) return;
        const normal = b.innerHTML;
        b.onclick = () => useCopy(ch.id, ch.value, b, normal, `${ch.name} number copied`);
      });

      const scroll = scope.querySelector("#bankScroll");
      const dots = scope.querySelector("#bankDots");
      if (scroll && dots && BANK_ACCOUNTS.length > 1) {
        scroll.addEventListener("scroll", () => {
          const i = Math.round(scroll.scrollLeft / scroll.clientWidth);
          dots.querySelectorAll("i").forEach((d, k) => d.classList.toggle("on", k === i));
        }, { passive: true });
      }
    }

    /* =====================================================================
       EVENT BINDING
    ===================================================================== */
    function bind(p) {
      const v = document.getElementById("view");

      v.querySelectorAll("[data-go]").forEach(el => el.onclick = () => navigate(el.dataset.go));
      v.querySelectorAll("[data-member]").forEach(el => {
        el.addEventListener("click", e => {
          if (e.target.closest("[data-remind],[data-delpay]")) return;
          navigate("/member/" + el.dataset.member);
        });
      });

      /* ---- home notification bell ---- */
      const bellBtn = v.querySelector("#homeBellBtn");
      if (bellBtn) bellBtn.onclick = () => {
        const n = duesList("Monthly Fee").length;
        toast(n ? `${n} member${n === 1 ? "" : "s"} have unpaid dues` : "You're all caught up", n ? "" : "ok");
      };

      /* ---- login ---- */
      const g = v.querySelector("#googleBtn");
      if (g) g.onclick = () => {
        busy(g, true);
        signInGoogle().catch(ex => toast(ex.message || "Google sign-in failed", "err")).finally(() => busy(g, false));
      };

      const af = v.querySelector("#adminForm");
      if (af) af.onsubmit = async e => {
        e.preventDefault();
        const btn = v.querySelector("#aSubmit"), err = v.querySelector("#aError");
        err.classList.add("hidden");
        busy(btn, true, "Signing in");
        try {
          await signInAdmin(v.querySelector("#aEmail").value, v.querySelector("#aPass").value);
          toast("Signed in as admin", "ok");
          navigate("/home");
        } catch (ex) {
          err.textContent = ex.message || "Sign in failed.";
          err.classList.remove("hidden");
        } finally { busy(btn, false); }
      };

      /* ---- members ---- */
      const ms = v.querySelector("#memberSearch");
      if (ms) ms.oninput = e => { state.memberQuery = e.target.value; rerenderList("#memberSearch", "memberQuery"); };

      v.querySelectorAll("[data-mfilter]").forEach(b => b.onclick = () => {
        state.memberFilter = b.dataset.mfilter;
        render();
      });

      const sortBtn = v.querySelector("#memberSortBtn");
      if (sortBtn) sortBtn.onclick = () => {
        const nextSort = { paid: "due", due: "name", name: "paid" };
        state.memberSort = nextSort[state.memberSort] || "paid";
        toast({ paid: "Sorted: top payer first", due: "Sorted: highest due first", name: "Sorted: A to Z" }[state.memberSort]);
        render();
      };

      const closeAdd = v.querySelector("#addMemberClose");
      if (closeAdd) closeAdd.onclick = () => { const c = v.querySelector("#addMemberCard"); if (c) c.hidden = true; };

      const mbell = v.querySelector("#membersBellBtn");
      if (mbell) mbell.onclick = () => {
        const n = duesList("Monthly Fee").length;
        toast(n ? `${n} member${n === 1 ? "" : "s"} have unpaid dues` : "You're all caught up", n ? "" : "ok");
      };

      /* avatar preview for the add-member form */
      const mAv = v.querySelector("#mAvatar");
      if (mAv) mAv.onchange = () => {
        const f = mAv.files && mAv.files[0];
        const prev = v.querySelector("#mAvatarPreview");
        const label = v.querySelector("#mAvatarName");
        if (!f) return;
        if (label) label.textContent = f.name;
        if (prev) {
          prev.style.backgroundImage = `url('${URL.createObjectURL(f)}')`;
          prev.style.backgroundSize = "cover";
          prev.style.backgroundPosition = "center";
          prev.innerHTML = "";
        }
      };

      const mf = v.querySelector("#addMemberCard");
      if (mf) mf.onsubmit = async e => {
        e.preventDefault();
        const name = v.querySelector("#mName").value.trim();
        const email = v.querySelector("#mEmail").value.trim();
        const file = mAv && mAv.files ? mAv.files[0] : null;
        if (!name) return;
        const submitBtn = v.querySelector("#mSubmitBtn");
        busy(submitBtn, true, "Adding");
        let avatarUrl = null;
        if (file) {
          avatarUrl = await uploadImageToImgbb(file);
          if (!avatarUrl) toast("Photo upload failed — member added without photo", "warn");
        }
        try {
          await db.addMember({ id: uid("mem"), name, email: email || null, avatar_url: avatarUrl });
          toast(name + " added", "ok");
          render();
        } catch (ex) { toast(ex.message, "err"); }
        finally { busy(submitBtn, false); }
      };

      /* ---- member detail ---- */
      const rb = v.querySelector("#remindBtn");
      if (rb) rb.onclick = () => {
        const m = state.members.find(x => x.id === p.split("/")[2]);
        if (m) remindOne(m, rb);
      };

      /* ---- delete member (admin, from member detail header) ---- */
      const delBtn = v.querySelector("#memberDeleteBtn");
      if (delBtn) delBtn.onclick = async () => {
        const m = state.members.find(x => x.id === delBtn.dataset.memberDel);
        if (!m) return;
        const count = state.payments.filter(x => x.member_id === m.id).length;
        const ok = await confirmDelete(
          `Delete ${m.name}? ${count} payment record${count === 1 ? "" : "s"} will be removed too. This cannot be undone.`,
          "Delete member"
        );
        if (!ok) return;
        const done = await db.deleteMember(m.id);
        if (done) {
          toast(`${m.name} deleted`, "warn");
          navigate("/members");
        }
      };

      const pb = v.querySelector("#pdfBtn");
      if (pb) pb.onclick = () => downloadReceipt(state.members.find(x => x.id === p.split("/")[2]));

      /* inline calendar: tap a day, same feel as a phone calendar */
      const payCal = v.querySelector("#payCal");
      if (payCal) {
        const setPayDate = (iso, redraw) => {
          const input = v.querySelector("#pDate");
          const shown = v.querySelector("#pDateShown");
          if (input) input.value = iso;
          if (shown) shown.textContent = prettyDate(iso);
          const monthSel = v.querySelector("#pMonth");
          if (monthSel && iso) monthSel.value = String(Number(iso.slice(5, 7)));
          if (redraw) drawPayCal(Number(iso.slice(0, 4)), Number(iso.slice(5, 7)));
          else {
            v.querySelectorAll("[data-day]").forEach(b => b.classList.toggle("on", b.dataset.day === iso));
          }
        };
        const drawPayCal = (year, month) => {
          payCal.dataset.y = String(year);
          payCal.dataset.m = String(month);
          const title = v.querySelector("#payCalTitle");
          if (title) title.textContent = MONTHS[month - 1] + " " + year;
          const grid = v.querySelector("#payCalGrid");
          if (!grid) return;
          const selected = (v.querySelector("#pDate") || {}).value || "";
          const today = todayISO();
          const firstDow = new Date(year, month - 1, 1).getDay();
          const days = new Date(year, month, 0).getDate();
          let html = "";
          for (let i = 0; i < firstDow; i++) html += `<span class="pay-cal-empty"></span>`;
          for (let d = 1; d <= days; d++) {
            const iso = `${year}-${pad(month)}-${pad(d)}`;
            const cls = ["pay-cal-day"];
            if (iso === selected) cls.push("on");
            if (iso === today) cls.push("today");
            html += `<button type="button" class="${cls.join(" ")}" data-day="${iso}" aria-label="${prettyDate(iso)}" aria-pressed="${iso === selected}">${d}</button>`;
          }
          grid.innerHTML = html;
          grid.querySelectorAll("[data-day]").forEach(b => b.onclick = () => setPayDate(b.dataset.day, false));
        };
        v.querySelectorAll("[data-calnav]").forEach(b => b.onclick = () => {
          let y = Number(payCal.dataset.y), m = Number(payCal.dataset.m) + Number(b.dataset.calnav);
          if (m < 1) { m = 12; y -= 1; }
          if (m > 12) { m = 1; y += 1; }
          drawPayCal(y, m);
        });
        drawPayCal(Number(payCal.dataset.y), Number(payCal.dataset.m));
      }

      const pf = v.querySelector("#payForm");
      /* remember the chosen "For month" so it survives a re-render */
      const monthSel = v.querySelector("#pMonth");
      if (monthSel) monthSel.onchange = () => { state.payMonthSel = monthSel.value; };

      if (pf) pf.onsubmit = async e => {
        e.preventDefault();
        const memberId = p.split("/")[2];
        const type = v.querySelector("#pType").value;
        const amount = Number(v.querySelector("#pAmount").value || 0);
        const mv = (v.querySelector("#pMonth").value || "").split("-");
        const my = Number(mv[0]) || YEAR();
        const mi = Number(mv[1]) || (nowLocal().getMonth() + 1);
        const date = v.querySelector("#pDate").value;
        if (!amount) return toast("Enter an amount", "err");
        const label = `${type} (${MONTHS[mi - 1]} ${my})`;
        state.payMonthSel = null;
        try {
          await db.addPayment({ member_id: memberId, amount, date, type: label });
          toast("Payment saved", "ok");
          render();
        } catch (ex) { toast(ex.message, "err"); }
      };

      v.querySelectorAll("[data-delpay]").forEach(b => b.onclick = async e => {
        e.stopPropagation();
        if (!(await confirmDelete("Delete this payment?"))) return;
        try { await db.deletePayment(b.dataset.delpay); toast("Payment deleted"); render(); }
        catch (ex) { toast(ex.message, "err"); }
      });

      /* ---- donations ---- */
      const ds = v.querySelector("#donSearch");
      if (ds) ds.oninput = e => { state.donQuery = e.target.value; rerenderList("#donSearch", "donQuery"); };
      v.querySelectorAll("[data-deldon]").forEach(b => b.onclick = async () => {
        if (!(await confirmDelete("Delete this donation?"))) return;
        try { await db.deleteDonation(b.dataset.deldon); toast("Donation deleted"); render(); }
        catch (ex) { toast(ex.message, "err"); }
      });
      const adc = v.querySelector("#addDonChip");
      if (adc) adc.onclick = () => {
        const c = v.querySelector("#addDonCard");
        c.classList.toggle("hidden");
        if (!c.classList.contains("hidden")) v.querySelector("#dDesc").focus();
      };
      const df = v.querySelector("#donForm");
      if (df) df.onsubmit = async e => {
        e.preventDefault();
        try {
          await db.addDonation({
            description: v.querySelector("#dDesc").value.trim(),
            date: v.querySelector("#dDate").value,
            amount: Number(v.querySelector("#dAmount").value || 0)
          });
          toast("Donation saved", "ok");
          render();
        } catch (ex) { toast(ex.message, "err"); }
      };

      /* ---- dues ---- */
      const dse = v.querySelector("#duesSearch");
      if (dse) dse.oninput = e => { state.duesSearch = e.target.value; rerenderList("#duesSearch", "duesSearch"); };

      const cm = v.querySelector("#chipMonth");
      if (cm) cm.onclick = () => openSheet(`
        <p class="eyebrow">Filter by month</p>
        <div style="height:6px"></div>
        <button class="opt" data-m="0" aria-selected="${state.duesMonth === 0}"><span>All months</span>${state.duesMonth === 0 ? ICONS.check : ""}</button>
        ${MONTHS.map((n, i) => `<button class="opt" data-m="${i + 1}" aria-selected="${state.duesMonth === i + 1}">
          <span>${n} ${YEAR()}</span>${state.duesMonth === i + 1 ? ICONS.check : ""}</button>`).join("")}`);
      v.querySelectorAll(".opt[data-m]").forEach(b => b.onclick = () => {
        state.duesMonth = Number(b.dataset.m); closeSheet(); render();
      });

      const ct = v.querySelector("#chipType");
      if (ct) ct.onclick = () => openSheet(`
        <p class="eyebrow">Filter by type</p>
        <div style="height:6px"></div>
        ${PAY_TYPES.map(t => `<button class="opt" data-t="${t}" aria-selected="${state.duesType === t}">
          <span>${t}</span>${state.duesType === t ? ICONS.check : ""}</button>`).join("")}`);
      v.querySelectorAll(".opt[data-t]").forEach(b => b.onclick = () => {
        state.duesType = b.dataset.t; closeSheet(); render();
      });

      const cc = v.querySelector("#chipClear");
      if (cc) cc.onclick = () => {
        state.duesMonth = 0; state.duesSearch = ""; state.duesType = "Monthly Fee";
        render(); toast("Filters cleared");
      };

      v.querySelectorAll("[data-remind]").forEach(b => b.onclick = e => {
        e.stopPropagation();
        const m = state.members.find(x => x.id === b.dataset.remind);
        if (m) remindOne(m, b);
      });

      /* ---- reminders ---- */
      const asw = v.querySelector("#autoSwitch");
      if (asw) asw.onclick = async () => {
        const sw = asw.querySelector(".switch");
        if (sw && !REDUCED) { sw.classList.remove("squash"); void sw.offsetWidth; sw.classList.add("squash"); }
        const next = !state.settings.auto_email_reminder;
        asw.setAttribute("aria-checked", String(next));
        try {
          await db.saveSettings({ auto_email_reminder: next });
          toast(next ? "Auto reminder enabled" : "Auto reminder paused", next ? "ok" : "");
        } catch (ex) {
          toast("Could not save setting", "err");
          asw.setAttribute("aria-checked", String(!next));
        }
      };
      const sab = v.querySelector("#sendAllBtn");
      if (sab) sab.onclick = () => sendAllReminders(sab);

      /* ---- profile ---- */
      /* ---- fee report: copy for Excel / download CSV ---- */
      const rpCopy = v.querySelector("#rpCopyBtn");
      if (rpCopy) {
        const normal = rpCopy.innerHTML;
        rpCopy.onclick = () => useCopy("report", reportTSV(), rpCopy, normal, "রিপোর্ট কপি হয়েছে — Excel বা Google Sheets-এ পেস্ট করুন");
      }
      const rpCsv = v.querySelector("#rpCsvBtn");
      if (rpCsv) rpCsv.onclick = downloadReportCsv;

      const so = v.querySelector("#signOutBtn");
      if (so) so.onclick = () => confirmDelete("Sign out of Healer Boy's?", "Sign out").then(ok => { if (ok) signOut(); });
    }

    /** keep focus in search inputs while re-rendering */
    function rerenderList(selector, key) {
      const el = document.querySelector(selector);
      const pos = el ? el.selectionStart : null;
      render();
      const next = document.querySelector(selector);
      if (next) { next.focus(); if (pos != null) { try { next.setSelectionRange(pos, pos); } catch (e) { } } }
    }

    function confirmDelete(msg, okText = "Confirm") {
      openSheet(`<p class="eyebrow">Please confirm</p>
        <p class="sub" style="margin:8px 0 14px">${esc(msg)}</p>
        <div class="g2">
          <button class="btn btn-outline" id="cNo" type="button">Cancel</button>
          <button class="btn btn-primary" id="cYes" type="button">${esc(okText)}</button>
        </div>
        <div style="height:calc(6px + var(--safe-b, 0px))"></div>`);
      return new Promise(res => {
        document.getElementById("cNo").onclick = () => { closeSheet(); res(false); };
        document.getElementById("cYes").onclick = () => { closeSheet(); res(true); };
        /* tapping the dim backdrop = cancel */
        const ov = document.getElementById("overlay");
        const onBg = e => { if (e.target === ov) { ov.removeEventListener("click", onBg); res(false); } };
        ov.addEventListener("click", onBg);
      });
    }

    /* =====================================================================
       BOOT
    ===================================================================== */
    (function clearProviderError() {
      const q = new URLSearchParams(location.search);
      const raw = (q.get("error_description") || q.get("msg") || "") + " " + (location.hash || "");
      if (!q.get("error") && !q.get("error_code") && !/provider is not enabled/i.test(raw)) return;
      history.replaceState(null, "", location.pathname + (location.hash.startsWith("#/") ? location.hash.split("?")[0] : ""));
    })();

    (async function boot() {
      const view = document.getElementById("view");
      view.innerHTML = `<div class="screen" style="display:grid;place-items:center;min-height:70vh">
        <div style="text-align:center">
          <div class="logo brand" style="margin:0 auto 14px" aria-label="Healer Boy's">${ICONS.brand}</div>
          <div class="skeleton" style="width:150px;margin:0 auto"></div>
        </div></div>`;

      /* Last-resort failsafe: if boot throws anywhere, still show the login page
         instead of leaving the user stuck on the loading skeleton. */
      const failsafe = setTimeout(() => {
        if (!state.booted) {
          console.warn("Boot failsafe fired — showing login.");
          state.loading = false;
          state.booted = true;
          try { route(); } catch (e) { console.error(e); }
        }
      }, 12000);
      window.addEventListener("error", () => clearTimeout(failsafe), { once: true });

      db.loadLocal();               // instant paint from cache
      state.settings = state.settings || { ...DEFAULT_SETTINGS };

      /* Never let a slow network keep the loading screen up. */
      const withTimeout = (promise, ms, label) => Promise.race([
        promise,
        new Promise((_, rej) => setTimeout(() => rej(new Error(label + " timed out")), ms))
      ]);

      if (sb) {
        try { await withTimeout(initAuth(), 8000, "Sign-in check"); }
        catch (e) { console.error(e); restoreLocalSession(); }
      } else {
        if (!restoreLocalSession()) setSession(null);
      }

      if (state.session) {
        try { await withTimeout(db.fetchAll(), 10000, "Loading data"); }
        catch (e) {
          console.error(e);
          toast("Showing saved data (" + e.message + ")", "err");
          db.loadLocal();
        }
      }
      state.loading = false;
      state.booted = true;
      clearTimeout(failsafe);
      route();

      // keep the app fresh when it regains focus
      document.addEventListener("visibilitychange", async () => {
        if (document.visibilityState === "visible" && sb && state.session) {
          try { await db.fetchAll(); route(); } catch (e) { }
        }
      });

      /* ---------------------------------------------------------------
         AUTO-LOGOUT (belt and braces)
         sessionStorage already dies with the window. Some Android PWA
         shells restore it on relaunch, so we also stamp the moment the
         app goes to the background; if it comes back after a long gap
         (the app was really closed/killed), we sign out and show login.
      --------------------------------------------------------------- */
      const AWAY_LIMIT_MS = 60 * 1000; // 1 minute away == app was closed
      const AWAY_KEY = "hb_away_at";

      const stampAway = () => { try { sessionStore && sessionStore.setItem(AWAY_KEY, String(Date.now())); } catch (e) { } };
      const checkAway = async () => {
        let at = 0;
        try { at = Number(sessionStore && sessionStore.getItem(AWAY_KEY)) || 0; } catch (e) { }
        if (!at || !state.session) return;
        if (Date.now() - at > AWAY_LIMIT_MS) {
          await signOut();
          toast("Signed out because the app was closed", "warn");
        }
        try { sessionStore && sessionStore.removeItem(AWAY_KEY); } catch (e) { }
      };

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") stampAway();
        else checkAway();
      });
      window.addEventListener("pagehide", stampAway);
      window.addEventListener("pageshow", checkAway);
      checkAway();
    })();

    window.addEventListener("hashchange", route);
  </script>
</body>

</html>
